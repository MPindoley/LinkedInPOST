            </div>
            <div className="slider-note">"Scheduled" posts are sent to your automation automatically at their date and time, as long as this app is open in a browser tab.</div>
            <div className="ctrl-label">Images <span className="opt">{(editing.images || []).length} attached</span></div>
            <div className="modal-thumbs">
              {(editing.images || []).map((d, k) => (
                <div key={k} className="mt-wrap">
                  <img src={d} alt="" />
                  <div className="mt-btns">
                    <button title="Move left" disabled={k === 0}
                      onClick={() => { const a = [...editing.images]; [a[k - 1], a[k]] = [a[k], a[k - 1]]; setEditing({ ...editing, images: a }); }}>‹</button>
                    <button title="Remove"
                      onClick={() => setEditing({ ...editing, images: editing.images.filter((_, j) => j !== k) })}>×</button>
                    <button title="Move right" disabled={k === (editing.images || []).length - 1}
                      onClick={() => { const a = [...editing.images]; [a[k + 1], a[k]] = [a[k], a[k + 1]]; setEditing({ ...editing, images: a }); }}>›</button>
                  </div>
                </div>
              ))}
              <button className="mt-add" onClick={() => imgRef.current && imgRef.current.click()}>+ Add</button>
              <input ref={imgRef} type="file" accept="image/*" multiple style={{ display: "none" }}
                onChange={(e) => { addImages(e.target.files); e.target.value = ""; }} />
            </div>
            <p className="hint">Studio posts arrive with their slides automatically via Send to Planner. Use + Add for your own photos; the first image is the carousel cover.</p>
            <div className="proof-actions">
              <button className="act" onClick={() => upsert(editing)}>Save</button>
              <button className="act ghost" onClick={() => remove(editing.id)}>Delete</button>
              <button className="act ghost" onClick={() => setEditing(null)}>Cancel</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ---- Component --------------------------------------------------------------
function ContentDesk() {
  const [page, setPage] = useState("studio");
  const [ayrKey, setAyrKey] = useState(() => {
    try { return localStorage.getItem("ayrshare_api_key") || ""; } catch (e) { return ""; }
  });
  function saveAyr(v) { setAyrKey(v); try { localStorage.setItem("ayrshare_api_key", v); } catch (e) {} }
  const [webhookUrl, setWebhookUrl] = useState(() => {
    try { return localStorage.getItem("post_webhook") || ""; } catch (e) { return ""; }
  });
  function saveWebhook(v) { setWebhookUrl(v); try { localStorage.setItem("post_webhook", v); } catch (e) {} }
  const [webhookImages, setWebhookImages] = useState(() => {
    try { return localStorage.getItem("webhook_images") === "1"; } catch (e) { return false; }
  });
  function saveWebhookImages(v) { setWebhookImages(v); try { localStorage.setItem("webhook_images", v ? "1" : "0"); } catch (e) {} }
  const [liToken, setLiToken] = useState(() => {
    try { return localStorage.getItem("li_api_token") || ""; } catch (e) { return ""; }
  });
  function saveLiToken(v) { setLiToken(v); try { localStorage.setItem("li_api_token", v); } catch (e) {} }
  const [sentMsg, setSentMsg] = useState("");
  const [pillarId, setPillarId] = useState("fact");
  const [tone, setTone] = useState("Educator");
  const [lenIdx, setLenIdx] = useState(1);
  const [slideCount, setSlideCount] = useState(5);
  const [topic, setTopic] = useState("");
  const [themeId, setThemeId] = useState("ivory"); // user's choice (may be "surprise")
  const [activeThemeId, setActiveThemeId] = useState("ivory"); // concrete theme being rendered
  const [templateId, setTemplateId] = useState("editorial"); // user's choice (may be "surprise")
  const [activeTemplate, setActiveTemplate] = useState("editorial"); // concrete layout being rendered
  const [fontsId, setFontsId] = useState("auto"); // "auto", a pairing id, or "surprise"
  const [activeFontsId, setActiveFontsId] = useState("auto"); // concrete pairing, or "auto"
  const [brandName, setBrandName] = useState("Matthew Pindoley, SE-AWMA®");
  const [brandHandle, setBrandHandle] = useState("MatthewPindoley.com");
  const [disclaimer, setDisclaimer] = useState(DEFAULT_DISCLAIMER);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [result, setResult] = useState(null);
  const [view, setView] = useState("post");
  const [slide, setSlide] = useState(0);
  const [copied, setCopied] = useState("");
  const [editDisc, setEditDisc] = useState(false);
  const [fontsReady, setFontsReady] = useState(false);
  const [modelId, setModelId] = useState("gpt-4o-mini");
  const [textSource, setTextSource] = useState("openai");
  const [photoMode, setPhotoMode] = useState("cover");
  const [imageSource, setImageSource] = useState("pollinations");
  const [slideImages, setSlideImages] = useState({});
  const [imgStatus, setImgStatus] = useState("");
  const [zipBusy, setZipBusy] = useState(false);
  const [apiKey, setApiKey] = useState(() => {
    try {
      const stored = localStorage.getItem("openai_api_key");
      if (stored) return stored;
      return "";
    } catch (e) { return ""; }
  });
  const [pexelsKey, setPexelsKey] = useState(() => {
    try { return localStorage.getItem("pexels_api_key") || ""; } catch (e) { return ""; }
  });
  function savePexels(v) {
    setPexelsKey(v);
    try { localStorage.setItem("pexels_api_key", v); } catch (e) {}
  }
  const [groqKey, setGroqKey] = useState(() => {
    try { return localStorage.getItem("groq_api_key") || ""; } catch (e) { return ""; }
  });
  function saveGroq(v) {
    setGroqKey(v);
    try { localStorage.setItem("groq_api_key", v); } catch (e) {}
  }
  const canvasRef = useRef(null);
  const recentRef = useRef([]); // last few hooks/topics, to push the model off repeats
  const lastTplRef = useRef("editorial"); // last layout used, so "Surprise" can avoid repeats
  const lastThemeRef = useRef("ivory"); // last theme used, same reason
  const lastFontRef = useRef("journal"); // last typeface pairing, same reason
  const autoBusyRef = useRef({}); // post ids currently being auto-sent

  // Scheduler: while this app is open, posts marked "scheduled" are sent to
  // the automation webhook automatically when their date and time arrive.
  useEffect(() => {
    const tick = async () => {
      const url = (webhookUrl || "").trim();
      if (!url) return;
      let plan;
      try { plan = (await idbGet("plan")) || []; } catch (e) { return; }
      if (!Array.isArray(plan)) return;
      const now = Date.now();
      let changed = false;
      for (const it of plan) {
        if (it.status !== "scheduled" || !it.date || !it.time) continue;
        const due = new Date(it.date + "T" + it.time).getTime();
        if (isNaN(due) || due > now || autoBusyRef.current[it.id]) continue;
        autoBusyRef.current[it.id] = true;
        if (checkViolations(it).length) {
          // Do not auto-post something a platform would reject; park it back
          // as a draft so it stops retrying and the owner can fix it.
          it.status = "draft";
          changed = true;
          continue;
        }
        try {
          await sendItemToWebhook(it, url, webhookImages, liToken);
          it.status = "posted";
          changed = true;
        } catch (e) {
          delete autoBusyRef.current[it.id]; // network hiccup: retry next tick
        }
      }
      if (changed) {
        try { await idbSet("plan", plan); window.dispatchEvent(new Event("plan-updated")); } catch (e) {}
      }
    };
    const t = setInterval(tick, 30000);
    tick();
    return () => clearInterval(t);
  }, [webhookUrl, webhookImages, liToken]);

  function saveKey(v) {
    setApiKey(v);
    try { localStorage.setItem("openai_api_key", v); } catch (e) {}
  }

  const pillar = PILLARS.find((p) => p.id === pillarId);
  const liveTopic = topic.trim();
  const slides = result?.carousel || [];

  const theme = THEMES[activeThemeId] || THEMES.ivory;
  const brand = useMemo(
    () => ({ name: brandName.trim() || "Matthew Pindoley, SE-AWMA®", handle: brandHandle.trim() || "MatthewPindoley.com" }),
    [brandName, brandHandle]
  );
  const drawOpts = useMemo(
    () => ({ theme, template: activeTemplate, kicker: pillar.label.toUpperCase(), brand,
             fonts: resolveFonts(activeFontsId, activeTemplate) }),
    [theme, activeTemplate, activeFontsId, pillar.label, brand]
  );

  // Picking a concrete layout updates the live preview immediately. "Surprise"
  // is resolved to a random layout at Generate time instead.
  useEffect(() => {
    if (templateId !== "surprise") setActiveTemplate(templateId);
  }, [templateId]);

  // Same live-preview behavior for the color theme.
  useEffect(() => {
    if (themeId !== "surprise") setActiveThemeId(themeId);
  }, [themeId]);

  // And for the typeface pairing.
  useEffect(() => {
    if (fontsId !== "surprise") setActiveFontsId(fontsId);
  }, [fontsId]);

  useEffect(() => {
    let dead = false;
    (async () => {
      try {
        // Every family the pairings can use, at the weights the slides draw.
        // Canvas silently falls back to Georgia if a face is not loaded yet.
        const jobs = [];
        for (const fam of FONT_FAMILIES) {
          for (const w of [400, 500, 600, 700, 800]) {
            jobs.push(document.fonts.load(w + ' 80px "' + fam + '"').catch(() => {}));
            jobs.push(document.fonts.load(w + ' 28px "' + fam + '"').catch(() => {}));
          }
        }
        await Promise.all(jobs);
        await document.fonts.ready;
      } catch (e) {}
      if (!dead) setFontsReady(true);
    })();
    return () => { dead = true; };
  }, []);

  useEffect(() => {
    if (view !== "carousel" || !canvasRef.current || !slides[slide]) return;
    drawSlide(canvasRef.current, slides[slide], slide, slides.length, drawOpts, slideImages[slide]);
  }, [view, slide, result, fontsReady, drawOpts, slideImages]);

  // A few rotating creative nudges so repeated clicks diverge instead of
  // converging on one "safe" answer.
  const SPINS = [
    "Take an unexpected angle most advisors would not think of.",
    "Use a fresh real-world analogy nobody overuses.",
    "Lead with a surprising contrast or a counterintuitive truth.",
    "Approach it through a specific, vivid everyday moment.",
    "Frame it around a question the reader has felt but never voiced.",
    "Find a non-obvious connection between two unrelated ideas.",
  ];

  async function generate() {
    setLoading(true); setError(""); setResult(null); setSlide(0); setView("post");
    setSlideImages({}); setImgStatus("");
    // Resolve the layout. "Surprise" rolls a random one, avoiding a repeat.
    let layout = templateId;
    if (templateId === "surprise") {
      const choices = SURPRISE_TEMPLATES.filter((id) => id !== lastTplRef.current);
      layout = choices[Math.floor(Math.random() * choices.length)] || "editorial";
      setActiveTemplate(layout);
    }
    lastTplRef.current = layout;
    // And the typeface pairing.
    if (fontsId === "surprise") {
      const picks = FONT_KEYS.filter((k) => k !== lastFontRef.current);
      const fontPick = picks[Math.floor(Math.random() * picks.length)] || "journal";
      setActiveFontsId(fontPick);
      lastFontRef.current = fontPick;
    } else if (fontsId !== "auto") {
      lastFontRef.current = fontsId;
    }
    // Same for the color theme.
    let themePick = themeId;
    if (themeId === "surprise") {
      const keys = Object.keys(THEMES).filter((k) => k !== lastThemeRef.current);
      themePick = keys[Math.floor(Math.random() * keys.length)] || "ivory";
      setActiveThemeId(themePick);
    }
    lastThemeRef.current = themePick;
    try {
      const nonce = Math.random().toString(36).slice(2, 8);
      const spin = SPINS[Math.floor(Math.random() * SPINS.length)];
      const avoid = recentRef.current.length
        ? ` Do NOT repeat or closely resemble any of these recent posts (pick a different topic, angle, and opening line): ${recentRef.current.map((h) => `"${h}"`).join("; ")}.`
        : "";
      const base = liveTopic
        ? `Topic / angle to use: "${liveTopic}". Generate the ${pillar.label} post and carousel around this.`
        : `No topic given, choose a fresh interesting one yourself. Generate the ${pillar.label} post and carousel.`;
      const userMsg = `${base}\n\n${spin} Make this draft distinctly different from anything generic. Variation token: ${nonce}.${avoid}`;
      const system = buildSystemPrompt(pillar, tone, LEN_WORDS[lenIdx], LEN_LABELS[lenIdx], slideCount);
      // Draft from the chosen writer, then parse its JSON.
      const draftOnce = async () => {
        const raw = textSource === "groq" ? await groqDraft(system, userMsg) : await openaiDraft(system, userMsg);
        const cleaned = raw.replace(/```json|```/g, "").trim();
        return cleanResult(JSON.parse(cleaned.slice(cleaned.indexOf("{"), cleaned.lastIndexOf("}") + 1)));
      };
      // Retry occasional malformed JSON from the free writer. Never retry key errors.
      const attempts = textSource === "openai" ? 1 : 3;
      let parsed = null, lastErr = null;
      for (let a = 0; a < attempts; a++) {
        try { parsed = await draftOnce(); break; }
        catch (e) {
          lastErr = e;
          if (/key|401|403/i.test((e && e.message) || "")) throw e;
        }
      }
      if (!parsed) throw new Error((lastErr && lastErr.message) ? ("Draft failed after retries: " + lastErr.message) : "That draft did not come through cleanly. Try Generate again.");
      setResult(parsed);
      // remember this hook so the next Generate avoids it
      recentRef.current = [parsed.hook, ...recentRef.current].filter(Boolean).slice(0, 10);
      // fire off photo generation (does not block the text from showing)
      if (photoMode !== "off") genImages(parsed.carousel || [], photoMode);
    } catch (e) {
      setError(e && e.message ? e.message : "That draft didn't come through cleanly. Try Generate again.");
    } finally {
      setLoading(false);
    }
  }

  // --- Writers. Each takes the system + user prompt and returns the raw JSON
  // string the model produced. -------------------------------------------------
  async function openaiDraft(system, user) {
    const key = apiKey.trim();
    if (!key) throw new Error("Add your OpenAI API key to write with OpenAI, or switch Writer to Free.");
    const r = await fetch(OPENAI_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + key },
      body: JSON.stringify({
        model: modelId, temperature: 1.0, top_p: 0.95, presence_penalty: 0.6, frequency_penalty: 0.4,
        max_tokens: 1500, response_format: { type: "json_object" },
        messages: [{ role: "system", content: system }, { role: "user", content: user }],
      }),
    });
    if (!r.ok) {
      let d = ""; try { d = (await r.json())?.error?.message || ""; } catch (e) {}
      if (r.status === 401) throw new Error("OpenAI key rejected (401). Check the key.");
      if (r.status === 429) throw new Error("OpenAI quota or rate limit (429). " + d);
      throw new Error("OpenAI error " + r.status + ". " + d);
    }
    return (await r.json()).choices?.[0]?.message?.content || "";
  }

  async function groqDraft(system, user) {
    const key = groqKey.trim();
    if (!key) throw new Error("Add your free Groq API key (console.groq.com) to write with Groq, or switch Writer to Free.");
    const r = await fetch(GROQ_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + key },
      body: JSON.stringify({
        model: GROQ_MODEL, temperature: 1.0, top_p: 0.95, max_tokens: 2048,
        response_format: { type: "json_object" },
        messages: [{ role: "system", content: system }, { role: "user", content: user }],
      }),
    });
    if (!r.ok) {
      let d = ""; try { d = (await r.json())?.error?.message || ""; } catch (e) {}
      if (r.status === 401) throw new Error("Groq key rejected (401). Check the key.");
      if (r.status === 429) throw new Error("Groq rate limit (429). Wait a moment and try again. " + d);
      throw new Error("Groq error " + r.status + ". " + d);
    }
    return (await r.json()).choices?.[0]?.message?.content || "";
  }

  // Fetch one photo per targeted slide from the chosen source, load it as a
  // data URL (so the canvas stays exportable), and store it.
  async function genImages(carousel, mode) {
    const targets = mode === "all" ? carousel.map((_, i) => i) : [0];
    let made = 0, lastErr = "";
    for (let t = 0; t < targets.length; t++) {
      const i = targets[t];
      setImgStatus("Fetching image " + (t + 1) + " of " + targets.length + "...");
      const s = carousel[i] || {};
      try {
        let dataUrl = null;
        if (imageSource === "pexels") dataUrl = await pexelsImage(s);
        else if (imageSource === "openai") dataUrl = await openaiImage(s);
        else dataUrl = await pollinationsImage(s);
        if (dataUrl) {
          await new Promise((res) => {
            const im = new Image();
            im.onload = () => { setSlideImages((prev) => ({ ...prev, [i]: im })); res(); };
            im.onerror = () => res();
            im.src = dataUrl;
          });
          made += 1;
        } else {
          lastErr = "No image was returned.";
        }
      } catch (e) {
        lastErr = e && e.message ? e.message : String(e);
        // Setup / auth / quota problems repeat for every slide, so stop now.
        if (/key|401|403|quota|429/i.test(lastErr)) { setImgStatus(lastErr); return; }
      }
    }
    setImgStatus(made ? "" : (lastErr || "No images were created."));
  }

  // Free real stock photo from Pexels, keyed to the slide.
  async function pexelsImage(s) {
    const key = pexelsKey.trim();
    if (!key) throw new Error("Add your free Pexels API key (pexels.com/api) to use stock photos, or switch Image source to Free AI.");
    const primary = String(s.image_query || s.image_prompt || s.title || s.headline || "minimal texture").slice(0, 80);
    const broad = primary.split(/[.,]/)[0].split(/\s+/).slice(0, 2).join(" ");
    const queries = [primary];
    if (broad && broad !== primary) queries.push(broad);
    queries.push("minimal muted background texture");
    for (const q of queries) {
      const r = await fetch(PEXELS_ENDPOINT + "?per_page=20&orientation=portrait&query=" + encodeURIComponent(q), { headers: { Authorization: key } });
      if (!r.ok) {
        if (r.status === 401) throw new Error("Pexels key rejected (401). Check the key.");
        if (r.status === 429) throw new Error("Pexels quota reached (429). It resets hourly.");
        throw new Error("Pexels error " + r.status + ".");
      }
      const d = await r.json();
      const photos = d.photos || [];
      if (photos.length) {
        const pick = photos[Math.floor(Math.random() * photos.length)];
        // Prefer the largest renditions so slides never upscale a small crop.
        const url = pick.src && (pick.src.large2x || pick.src.original || pick.src.large || pick.src.portrait);
        if (url) {
          const ir = await fetch(url);
          if (ir.ok) return await blobToDataUrl(await ir.blob());
        }
      }
    }
    throw new Error("No stock photo matched this slide. Try a different topic.");
  }

  // Free AI image from Pollinations, no key required.
  async function pollinationsImage(s) {
    const subject = s.image_prompt || s.title || s.headline || "calm minimal still life";
    const seed = Math.floor(Math.random() * 1e9);
    // Exact 4:5 slide size, so nothing is cropped or upscaled.
    const url = POLLINATIONS_ENDPOINT + encodeURIComponent(subject + ". " + IMAGE_STYLE) +
      "?width=1080&height=1350&nologo=true&seed=" + seed + "&model=flux";
    const r = await fetch(url);
    if (!r.ok) throw new Error("Free AI image service error " + r.status + ". Try again in a moment.");
    return await blobToDataUrl(await r.blob());
  }

  // Paid AI image from OpenAI, trying the current model then the legacy one.
  async function openaiImage(s) {
    const key = apiKey.trim();
    if (!key) throw new Error("Add your OpenAI API key to use OpenAI images.");
    const VARY = ["", " Shot from a slightly different angle.", " Different time of day and light.", " Alternative composition and framing.", " A different but related subject in the same style."];
    const subject = s.image_prompt || s.title || s.headline || "an abstract calm financial concept";
    const prompt = subject + ". " + IMAGE_STYLE + VARY[Math.floor(Math.random() * VARY.length)];
    let lastErr = "";
    for (const cfg of IMAGE_ATTEMPTS) {
      try {
        const r = await fetch(OPENAI_IMAGE_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: "Bearer " + key },
          body: JSON.stringify({ model: cfg.model, prompt, n: 1, ...cfg.extra }),
        });
        if (r.ok) {
          const d = await r.json();
          const b64 = d.data?.[0]?.b64_json;
          if (b64) return "data:image/png;base64," + b64;
          lastErr = cfg.model + " returned no image data.";
        } else {
          let m = ""; try { m = (await r.json())?.error?.message || ""; } catch (e) {}
          lastErr = cfg.model + " error " + r.status + (m ? ": " + m : "") + ".";
          if (r.status === 401) throw new Error("OpenAI key rejected (401).");
          if (r.status === 429) throw new Error("OpenAI quota or rate limit (429). " + m);
        }
      } catch (e) {
        if (/OpenAI key|quota|429/i.test(e && e.message)) throw e;
        lastErr = e && e.message ? e.message : String(e);
      }
    }
    throw new Error(lastErr || "OpenAI image failed. It may require organization verification or billing.");
  }

  // Snapshot the current slides as PNG data URLs and save the post to the Planner.
  async function sendToPlanner() {
    if (!result) return;
    const images = [];
    for (let i = 0; i < slides.length; i++) {
      const c = document.createElement("canvas");
      drawSlide(c, slides[i], i, slides.length, drawOpts, slideImages[i]);
      images.push(c.toDataURL("image/png"));
    }
    const item = {
      id: "p" + Date.now() + Math.random().toString(36).slice(2, 6),
      caption: fullPostText(),
      platforms: ["linkedin"],
      date: new Date().toISOString().slice(0, 10),
      time: "09:00", status: "draft", images,
    };
    try {
      const plan = (await idbGet("plan")) || [];
      await idbSet("plan", [...(Array.isArray(plan) ? plan : []), item]);
      setSentMsg("Saved to Planner");
      setTimeout(() => setSentMsg(""), 2500);
    } catch (e) {
      setError("Could not save to the Planner on this browser.");
    }
  }

  // Make fresh photos for the current post without rewriting any text.
  function regenPhotos() {
    if (!result || photoMode === "off" || imgStatus) return;
    genImages(result.carousel || [], photoMode);
  }

  function fullPostText() {
    if (!result) return "";
    const disc = pillar.general ? "" : `${disclaimer}\n\n`;
    return `${result.hook}\n\n${result.body}\n\n${disc}` + (result.hashtags || []).join(" ");
  }

  function copy(text, key) {
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
    setCopied(key); setTimeout(() => setCopied(""), 1600);
  }

  function downloadAll() {
    slides.forEach((s, i) => {
      const c = document.createElement("canvas");
      drawSlide(c, s, i, slides.length, drawOpts, slideImages[i]);
      setTimeout(() => downloadCanvas(c, `carousel-slide-${i + 1}.jpg`), i * 280);
    });
  }

  // One file with the caption and every slide, ready to upload in one go.
  async function downloadZip() {
    if (!result || zipBusy) return;
    setZipBusy(true);
    try {
      const files = [{ name: "caption.txt", data: new TextEncoder().encode(fullPostText()) }];
      for (let i = 0; i < slides.length; i++) {
        const c = document.createElement("canvas");
        drawSlide(c, slides[i], i, slides.length, drawOpts, slideImages[i]);
        const blob = await new Promise((res) => c.toBlob(res, "image/jpeg", 0.95));
        const buf = new Uint8Array(await blob.arrayBuffer());
        files.push({ name: "slide-" + String(i + 1).padStart(2, "0") + ".jpg", data: buf });
      }
      downloadBlob(makeZip(files), "linkedin-carousel.zip");
    } catch (e) {
      setError("Could not build the zip. Try Download all instead.");
    } finally {
      setZipBusy(false);
    }
  }

  // The LinkedIn carousel format: every slide as a page of one PDF, uploaded
  // to LinkedIn as a document post.
  function downloadPdf() {
    if (!result || !slides.length) return;
    const urls = [];
    for (let i = 0; i < slides.length; i++) {
      const c = document.createElement("canvas");
      drawSlide(c, slides[i], i, slides.length, drawOpts, slideImages[i]);
      urls.push(c.toDataURL("image/jpeg", 0.95));
    }
    downloadBlob(makePdf(urls), "linkedin-carousel.pdf");
  }

  return (
    <div className="desk">
      <style>{css}</style>

      <header className="masthead">
        <div className="mast-left">
          <div className="mast-eyebrow">CONTENT STUDIO &middot; FINANCIAL ADVISOR</div>
          <h1 className="mast-title">The Desk</h1>
        </div>
        <div className="mast-nav">
          <button className={"navtab" + (page === "studio" ? " on" : "")} onClick={() => setPage("studio")}>Studio</button>
          <button className={"navtab" + (page === "planner" ? " on" : "")} onClick={() => setPage("planner")}>Planner</button>
        </div>
      </header>

      {page === "planner" && (
        <Planner ayrKey={ayrKey} setAyrKey={saveAyr} webhookUrl={webhookUrl} setWebhookUrl={saveWebhook}
          webhookImages={webhookImages} setWebhookImages={saveWebhookImages}
          liToken={liToken} setLiToken={saveLiToken} onBack={() => setPage("studio")} />
      )}

      {page === "studio" && (
      <div className="grid">
        <section className="controls">
          <div className="ctrl-label">Writer <span className="opt">who writes the text</span></div>
          <div className="tones">
            {TEXT_SOURCES.map((m) => (
              <button key={m.id} className={"tone" + (m.id === textSource ? " on" : "")} onClick={() => setTextSource(m.id)}>{m.label}</button>
            ))}
          </div>
          <div className="slider-note">{(TEXT_SOURCES.find((s) => s.id === textSource) || {}).note}</div>
          {textSource === "groq" && (
            <input className="topic mt8" type="password" value={groqKey} autoComplete="off"
              onChange={(e) => saveGroq(e.target.value)} placeholder="Groq API key (free at console.groq.com)" />
          )}

          {(textSource === "openai" || imageSource === "openai") && (
            <>
              <div className="ctrl-label">OpenAI API key</div>
              <input className="topic" type="password" value={apiKey} autoComplete="off"
                onChange={(e) => saveKey(e.target.value)} placeholder="sk-..." />
            </>
          )}
          {textSource === "openai" && (
            <>
              <div className="ctrl-label">OpenAI model</div>
              <div className="tones">
                {OPENAI_MODELS.map((m) => (
                  <button key={m.id} className={"tone" + (m.id === modelId ? " on" : "")} onClick={() => setModelId(m.id)}>{m.label}</button>
                ))}
              </div>
            </>
          )}

          <div className="ctrl-label">Pillar</div>
          <div className="pillars">
            {PILLARS.map((p) => (
              <button key={p.id} className={"pillar" + (p.id === pillarId ? " on" : "")} onClick={() => setPillarId(p.id)}>
                <span className="pillar-tag">{p.tag}</span>
                <span className="pillar-name">{p.label}</span>
                <span className="pillar-blurb">{p.blurb}</span>
              </button>
            ))}
          </div>

          <div className="ctrl-label">Topic <span className="opt">optional</span></div>
          <input className="topic" value={topic} onChange={(e) => setTopic(e.target.value)}
            placeholder="e.g. octopuses, the Roth deadline, coaching season..." />

          <div className="ctrl-label">Max length</div>
          <input className="slider" type="range" min={0} max={3} step={1} value={lenIdx}
            onChange={(e) => setLenIdx(Number(e.target.value))} />
          <div className="slider-row">
            {LEN_LABELS.map((l, i) => (
              <span key={l} className={"slider-tick" + (i === lenIdx ? " on" : "")}>{l}</span>
            ))}
          </div>
          <div className="slider-note">Up to ~{LEN_WORDS[lenIdx]} words. A ceiling, not a target.</div>

          <div className="ctrl-label">Slides <span className="opt">1 to 5</span></div>
          <div className="tones">
            {[1, 2, 3, 4, 5].map((n) => (
              <button key={n} className={"tone" + (n === slideCount ? " on" : "")} onClick={() => setSlideCount(n)}>{n}</button>
            ))}
          </div>
          <div className="slider-note">{slideCount === 1 ? "One cover slide (a title, plus a photo if enabled)." : slideCount + " slides in the carousel."}</div>

          <div className="ctrl-label">Voice</div>
          <div className="tones">
            {TONES.map((t) => (
              <button key={t} className={"tone" + (t === tone ? " on" : "")} onClick={() => setTone(t)}>{t}</button>
            ))}
          </div>

          <div className="ctrl-label">Carousel layout</div>
          <div className="layouts">
            {[...TEMPLATES, { id: "surprise", label: "Surprise", blurb: "Random layout each time you generate." }].map((t) => (
              <button key={t.id} className={"tone" + (t.id === templateId ? " on" : "")} onClick={() => setTemplateId(t.id)} title={t.blurb}>{t.label}</button>
            ))}
          </div>
          {templateId === "surprise" && (
            <div className="slider-note">A random layout is chosen on each Generate. Silent is left out, so you never get a carousel with no words.</div>
          )}
          {templateId === "silent" && (
            <div className="slider-note">
              {photoMode === "off"
                ? "Silent shows the photo by itself, so turn Slide photos on below. Without a photo these slides fall back to Editorial."
                : photoMode === "cover"
                  ? "Slide 1 will be the photo alone. The rest fall back to Editorial, since only the cover gets a photo."
                  : "Every slide will be the photo alone, with no words on it."}
            </div>
          )}

          <div className="ctrl-label">Carousel theme</div>
          <div className="themes">
            {Object.entries(THEMES).map(([id, t]) => (
              <button key={id} className={"theme-btn" + (id === themeId ? " on" : "")} onClick={() => setThemeId(id)}>
                <span className="sw" style={{ background: t.coverBg }} />
                <span className="sw" style={{ background: t.bg }} />
                <span className="sw" style={{ background: t.accent }} />
                <span className="theme-name">{t.name}</span>
              </button>
            ))}
            <button className={"theme-btn" + (themeId === "surprise" ? " on" : "")} onClick={() => setThemeId("surprise")}
              title="A random theme each time you generate.">
              <span className="sw" style={{ background: "#C7A266" }} />
              <span className="sw" style={{ background: "#2F6B62" }} />
              <span className="sw" style={{ background: "#6E4A8E" }} />
              <span className="theme-name">Surprise</span>
            </button>
          </div>
          {themeId === "surprise" && (
            <div className="slider-note">A random theme is chosen on each Generate.</div>
          )}

          <div className="ctrl-label">Typeface</div>
          <div className="layouts">
            {[{ id: "auto", name: "Match layout", blurb: "Each layout uses the type it was drawn for." },
              ...FONT_KEYS.map((id) => ({ id, name: FONT_SETS[id].name, blurb: FONT_SETS[id].blurb })),
              { id: "surprise", name: "Surprise", blurb: "A random pairing each time you generate." }].map((o) => (
              <button key={o.id} className={"tone" + (o.id === fontsId ? " on" : "")}
                onClick={() => setFontsId(o.id)} title={o.blurb}>{o.name}</button>
            ))}
          </div>
          <div className="slider-note">
            {fontsId === "surprise"
              ? "A random typeface pairing is chosen on each Generate."
              : fontsId === "auto"
                ? "Each layout uses the typeface it was designed around."
                : FONT_SETS[fontsId].blurb}
          </div>

          <div className="ctrl-label">Slide photos <span className="opt">optional</span></div>
          <div className="tones">
            {PHOTO_MODES.map((m) => (
              <button key={m.id} className={"tone" + (m.id === photoMode ? " on" : "")} onClick={() => setPhotoMode(m.id)}>{m.label}</button>
            ))}
          </div>
          <div className="slider-note">
            {photoMode === "off"
              ? "Clean color slides, no images."
              : photoMode === "cover"
              ? "A photo behind the cover slide only."
              : "A different photo behind every slide."}
          </div>

          {photoMode !== "off" && (
            <>
              <div className="ctrl-label">Image source</div>
              <div className="tones">
                {IMAGE_SOURCES.map((m) => (
                  <button key={m.id} className={"tone" + (m.id === imageSource ? " on" : "")} onClick={() => setImageSource(m.id)}>{m.label}</button>
                ))}
              </div>
              <div className="slider-note">{(IMAGE_SOURCES.find((s) => s.id === imageSource) || {}).note}</div>
              {imageSource === "pexels" && (
                <input className="topic mt8" type="password" value={pexelsKey} autoComplete="off"
                  onChange={(e) => savePexels(e.target.value)} placeholder="Pexels API key (free at pexels.com/api)" />
              )}
            </>
          )}

          <div className="ctrl-label">Byline <span className="opt">on every slide</span></div>
          <input className="topic" value={brandName} onChange={(e) => setBrandName(e.target.value)} placeholder="Your Name, CFP" />
          <input className="topic mt8" value={brandHandle} onChange={(e) => setBrandHandle(e.target.value)} placeholder="@yourhandle" />

          <button className="generate" onClick={generate} disabled={loading}>
            {loading ? "Drafting..." : liveTopic ? "Generate draft" : "Surprise me"}
          </button>
          <p className="hint">Generates a post and a matching image carousel together. The byline ties them as one piece. Always route to your back office before publishing.</p>
        </section>

        <section className="output">
          {!result && !loading && !error && (
            <div className="empty">
              <div className="empty-mark">&para;</div>
              <p>Pick a pillar and hit generate. Your draft proof lands here: the post on one tab, downloadable image slides on the other, with a live preview of the carousel right under the post.</p>
            </div>
          )}
          {loading && (<div className="empty"><div className="empty-mark spin">&#9716;</div><p>Setting the type...</p></div>)}
          {error && (<div className="empty err"><div className="empty-mark">!</div><p>{error}</p></div>)}

          {result && (
            <>
              <div className="tabs">
                <button className={"tab" + (view === "post" ? " on" : "")} onClick={() => setView("post")}>Post</button>
                <button className={"tab" + (view === "carousel" ? " on" : "")} onClick={() => setView("carousel")}>Carousel</button>
                <div className="tab-meta">{((TEMPLATES.find((t) => t.id === activeTemplate) || {}).label || "").toUpperCase()} &middot; {theme.name.toUpperCase()}</div>
              </div>

              {view === "post" && (
                <div className="proof">
                  <div className="proof-dateline">DRAFT PROOF &middot; FOR REVIEW</div>
                  <p className="proof-hook">{result.hook}</p>
                  <div className="proof-body">
                    {String(result.body || "").split("\n").filter(Boolean).map((line, i) => (<p key={i}>{line}</p>))}
                  </div>
                  {!pillar.general && <div className="proof-disc">{disclaimer}</div>}
                  <div className="proof-tags">
                    {(result.hashtags || []).map((h, i) => (<span key={i} className="tagchip">{h}</span>))}
                  </div>

                  <div className="proof-byline">
                    <span className="by-name">{brand.name}</span>
                    <span className="by-handle">{brand.handle}</span>
                  </div>

                  {slides.length > 0 && (
                    <div className="proof-carousel">
                      <div className="thumbs-label">
                        CAROUSEL &middot; {slides.length} SLIDES &middot; CLICK TO OPEN
                        {imgStatus ? <span className="img-status"> &middot; {imgStatus}</span> : null}
                      </div>
                      <div className="thumbs">
                        {slides.map((s, i) => (
                          <SlideThumb key={i} slide={s} i={i} total={slides.length} opts={drawOpts}
                            img={slideImages[i]} ready={fontsReady} active={false}
                            onClick={() => { setView("carousel"); setSlide(i); }} />
                        ))}
                      </div>
                    </div>
                  )}

                  <div className="proof-actions">
                    <button className="act" onClick={() => copy(fullPostText(), "post")}>{copied === "post" ? "Copied ✓" : "Copy post"}</button>
                    <button className="act" onClick={sendToPlanner}>{sentMsg || "Send to Planner"}</button>
                    <button className="act" onClick={downloadZip} disabled={zipBusy}>{zipBusy ? "Zipping..." : "Download .zip"}</button>
                    <button className="act ghost" onClick={generate}>Regenerate</button>
                    {photoMode !== "off" && (
                      <button className="act ghost" onClick={regenPhotos} disabled={!!imgStatus}>
                        {imgStatus ? "Working..." : "Regenerate photos"}
                      </button>
                    )}
                  </div>
                </div>
              )}

              {view === "carousel" && (
                <div className="carousel">
                  <div className="slide-stage">
                    <button className="nav" onClick={() => setSlide((s) => Math.max(0, s - 1))} disabled={slide === 0}>&#8249;</button>
                    <canvas ref={canvasRef} className="slide-canvas" />
                    <button className="nav" onClick={() => setSlide((s) => Math.min(slides.length - 1, s + 1))} disabled={slide === slides.length - 1}>&#8250;</button>
                  </div>
                  <div className="dots">
                    {slides.map((_, i) => (<button key={i} className={"dot" + (i === slide ? " on" : "")} onClick={() => setSlide(i)} />))}
                  </div>
                  <div className="proof-actions center">
                    <button className="act" onClick={downloadZip} disabled={zipBusy}>{zipBusy ? "Zipping..." : "Download .zip (caption + slides)"}</button>
                    <button className="act" onClick={downloadPdf}>PDF (LinkedIn carousel)</button>
                    <button className="act" onClick={() => canvasRef.current && downloadCanvas(canvasRef.current, `carousel-slide-${slide + 1}.jpg`)}>This slide</button>
                    <button className="act" onClick={downloadAll}>All slides</button>
                    {photoMode !== "off" && (
                      <button className="act ghost" onClick={regenPhotos} disabled={!!imgStatus}>
                        {imgStatus ? "Working..." : "Regenerate photos"}
                      </button>
                    )}
                    <button className="act ghost" onClick={generate}>Regenerate all</button>
                  </div>
                  <p className="hint center">
                    1080 &times; 1350 JPG slides, compliance-friendly and ready to upload. {imgStatus ? imgStatus : "The minimal slides pull the swipe; the full read lives in your post caption."}
                  </p>
                </div>
              )}

              {!pillar.general && (
                <div className="compliance">
                  <div className="comp-head">
                    <span>Before you submit to back office</span>
                    <button className="disc-edit" onClick={() => setEditDisc((v) => !v)}>{editDisc ? "Done" : "Edit disclaimer"}</button>
                  </div>
                  {editDisc && (<textarea className="disc-box" value={disclaimer} onChange={(e) => setDisclaimer(e.target.value)} rows={3} />)}
                  <ul className="checks">
                    {STATIC_CHECKS.map((c, i) => (<li key={i}><span className="tick">&#10003;</span>{c}</li>))}
                  </ul>
                  {result.reviewer_notes && result.reviewer_notes.length > 0 && (
                    <div className="flags">
                      <div className="flags-head">Flag for this draft</div>
                      {result.reviewer_notes.map((n, i) => (<div key={i} className="flag">{n}</div>))}
                    </div>
                  )}
                </div>
              )}
            </>
          )}
        </section>
      </div>
      )}
    </div>
  );
}

const css = `
@import url('https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Inter+Tight:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Playfair+Display:wght@400;500;600;700&family=Libre+Franklin:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,700&family=DM+Serif+Display&family=Lora:wght@400;500;600;700&family=Archivo:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;700&family=Oswald:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap');

.desk {
  --bg:#0E1117; --panel:#161B24; --panel2:#1C222D; --line:#2A313E;
  --paper:#F4F1EA; --paper-ink:#1B1A17; --paper-line:#E0DACB;
  --brass:#C79A5B; --brass-dim:#9A7842; --text:#E7E4DD; --muted:#929BAA; --sage:#7FA08F;
  font-family:'Inter Tight',system-ui,sans-serif; background:var(--bg); color:var(--text);
  min-height:100%; padding:28px; box-sizing:border-box; line-height:1.5;
}
.desk *{box-sizing:border-box;}

.mast-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.22em;color:var(--brass);margin-bottom:6px;}
.mast-title{font-family:'Newsreader',serif;font-weight:500;font-size:42px;letter-spacing:-.01em;margin:0;line-height:1;}
.mast-right{display:flex;align-items:center;gap:10px;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.18em;color:var(--muted);}
.mast-dot{width:4px;height:4px;border-radius:50%;background:var(--brass-dim);}
.mast-nav{display:flex;gap:8px;}
.navtab{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:9px;padding:9px 18px;font-family:'Newsreader',serif;font-size:16px;cursor:pointer;}
.navtab:hover{color:var(--text);border-color:var(--brass-dim);}
.navtab.on{color:var(--brass);border-color:var(--brass);background:#20262F;}

.planner{max-width:900px;}
.plan-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
.plan-actions{display:flex;gap:8px;flex-wrap:wrap;}
.plan-status{font-size:12.5px;color:var(--brass);font-family:'IBM Plex Mono',monospace;}
.act.sm{padding:6px 11px;font-size:12px;}
.act.auto{background:var(--brass);color:#1A1407;}
.planner .act.ghost{color:var(--text);border-color:var(--line);background:none;}
.planner .act.ghost:hover{border-color:var(--brass);color:var(--brass);}
.cal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:20px;}
.cal-head{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:12px;}
.cal-title{font-family:'Newsreader',serif;font-size:22px;min-width:200px;text-align:center;}
.cal-dow-row{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;grid-auto-rows:88px;}

.cal-chip.s-scheduled{background:#3a3320;color:var(--brass);}
.cal-chip.s-posted{background:#22301f;color:var(--sage);}
.cal-more{font-size:9px;color:var(--muted);}
.plan-key{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:20px;}
.wh-check{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--muted);margin-top:8px;cursor:pointer;}
.wh-check input{margin-top:2px;accent-color:var(--brass);}
.limit-note{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);margin:6px 0 2px;}
.limit-checks{margin-top:10px;display:flex;flex-direction:column;gap:4px;}
.limit-row{font-size:12px;color:var(--sage);}
.limit-row.bad{color:#C77;}
.pi-viol{font-size:12px;color:#C77;margin-bottom:8px;line-height:1.5;}
.plan-list{display:flex;flex-direction:column;gap:10px;}
.plan-item{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;}
.pi-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.pi-date{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);}
.pi-status{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}

.pi-status.s-posted{color:var(--sage);}
.pi-cap{font-size:13.5px;line-height:1.5;margin-bottom:6px;}
.pi-plats{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--brass-dim);margin-bottom:10px;}
.pi-actions{display:flex;gap:7px;flex-wrap:wrap;}
.modal-back{position:fixed;inset:0;background:rgba(8,10,14,.72);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;width:100%;max-width:520px;max-height:90vh;overflow:auto;}
.plat-row{display:flex;gap:6px;flex-wrap:wrap;}
.two-col{display:flex;gap:12px;}
.two-col>div{flex:1;}
.modal-thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 8px;align-items:flex-start;}
.modal-thumbs img{width:52px;height:65px;object-fit:cover;border-radius:5px;border:1px solid var(--line);display:block;}
.mt-wrap{display:flex;flex-direction:column;align-items:center;gap:3px;}
.mt-btns{display:flex;gap:2px;}
.mt-btns button{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:4px;font-size:11px;width:18px;height:18px;line-height:1;cursor:pointer;padding:0;}
.mt-btns button:hover{color:var(--brass);border-color:var(--brass-dim);}
.mt-btns button:disabled{opacity:.3;cursor:default;}
.mt-add{width:52px;height:65px;border:1px dashed var(--line);background:none;color:var(--muted);border-radius:5px;cursor:pointer;font-size:12px;}
.mt-add:hover{border-color:var(--brass);color:var(--brass);}

.grid{display:grid;grid-template-columns:340px 1fr;gap:24px;align-items:start;}
@media(max-width:820px){.grid{grid-template-columns:1fr;}}

.controls{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;}
.ctrl-label{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin:18px 0 10px;}
.ctrl-label:first-child{margin-top:0;}
.opt{color:var(--brass-dim);}

.pillars{display:flex;flex-direction:column;gap:8px;}
.pillar{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center;transition:border-color .15s,background .15s;}
.pillar:hover{border-color:var(--brass-dim);}
.pillar.on{border-color:var(--brass);background:#20262F;}
.pillar-tag{grid-row:1/3;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--brass);border:1px solid var(--brass-dim);border-radius:5px;padding:4px 6px;align-self:start;}
.pillar.on .pillar-tag{background:var(--brass);color:#1A1407;border-color:var(--brass);}
.pillar-name{font-size:14px;font-weight:600;color:var(--text);}
.pillar-blurb{font-size:11.5px;color:var(--muted);line-height:1.35;}

.topic{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:11px 12px;color:var(--text);font-family:inherit;font-size:13.5px;}
.topic.mt8{margin-top:8px;}
.topic:focus{outline:none;border-color:var(--brass);}
.topic::placeholder{color:#5C6577;}

.slider{width:100%;accent-color:var(--brass);cursor:pointer;}
.slider-row{display:flex;justify-content:space-between;margin-top:8px;}
.slider-tick{font-size:11px;color:var(--muted);}
.slider-tick.on{color:var(--brass);font-weight:600;}
.slider-note{font-size:11px;color:var(--brass-dim);margin-top:6px;}

.tones{display:flex;gap:6px;}
.tone{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 4px;color:var(--muted);font-family:inherit;font-size:11.5px;cursor:pointer;transition:.15s;}
.tone:hover{color:var(--text);}
.tone.on{border-color:var(--brass);color:var(--brass);background:#20262F;}

.layouts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.theme-btn{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 4px 7px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;align-items:center;gap:6px;}
.theme-btn:hover{border-color:var(--brass-dim);}
.theme-btn.on{border-color:var(--brass);background:#20262F;}
.theme-btn .sw{width:26px;height:7px;border-radius:2px;display:block;}
.theme-btn .sw:first-of-type{margin-top:0;}
.theme-btn{position:relative;}
.theme-btn .sw{margin:0;}
.theme-btn .theme-name{font-size:11px;color:var(--muted);margin-top:2px;}
.theme-btn.on .theme-name{color:var(--brass);font-weight:600;}

.generate{width:100%;margin-top:20px;background:var(--brass);color:#1A1407;border:none;border-radius:10px;padding:13px;font-family:'Newsreader',serif;font-size:17px;font-weight:600;cursor:pointer;transition:.15s;}
.generate:hover{background:#D6A968;}
.generate:disabled{opacity:.55;cursor:wait;}
.hint{font-size:11px;color:var(--muted);margin:12px 0 0;line-height:1.45;}
.hint.center{text-align:center;}

.output{min-height:420px;}
.empty{height:420px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px;padding:40px;}
.empty p{max-width:380px;font-size:13.5px;}
.empty-mark{font-family:'Newsreader',serif;font-size:46px;color:var(--brass-dim);margin-bottom:10px;}
.empty.err .empty-mark{color:#C77;}
.spin{animation:sp 1.1s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}

.tabs{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
.tab{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);font-family:inherit;font-size:14px;font-weight:600;padding:4px 2px;cursor:pointer;}
.tab.on{color:var(--text);border-bottom-color:var(--brass);}
.tab-meta{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;color:var(--brass-dim);}

.proof{background:var(--paper);color:var(--paper-ink);border-radius:14px;padding:30px 32px;box-shadow:0 18px 50px rgba(0,0,0,.35);}
.proof-dateline{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.2em;color:var(--brass-dim);padding-bottom:14px;margin-bottom:18px;border-bottom:1px solid var(--paper-line);}
.proof-hook{font-family:'Newsreader',serif;font-size:25px;font-weight:600;line-height:1.25;margin:0 0 16px;letter-spacing:-.01em;}
.proof-body p{font-size:14.5px;line-height:1.6;margin:0 0 11px;}
.proof-disc{font-size:11.5px;color:#6A6353;font-style:italic;border-left:2px solid var(--brass);padding-left:11px;margin:18px 0;}
.proof-tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:6px;}
.tagchip{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--brass-dim);}

.proof-byline{display:flex;align-items:baseline;gap:10px;margin-top:18px;padding-top:14px;border-top:1px solid var(--paper-line);}
.by-name{font-weight:600;font-size:13.5px;color:var(--paper-ink);}
.by-handle{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--brass-dim);}

.proof-carousel{margin-top:16px;}
.thumbs-label{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.18em;color:var(--brass-dim);margin-bottom:9px;}
.img-status{color:var(--brass);}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;}
.thumb{padding:0;border:1px solid var(--paper-line);background:none;border-radius:8px;overflow:hidden;cursor:pointer;line-height:0;transition:.15s;}
.thumb:hover{border-color:var(--brass);transform:translateY(-2px);}
.thumb.on{outline:2px solid var(--brass);}
.thumb canvas{width:64px;height:80px;display:block;}

.proof-actions{display:flex;gap:10px;margin-top:20px;padding-top:18px;border-top:1px solid var(--paper-line);flex-wrap:wrap;}
.proof-actions.center{justify-content:center;border:none;padding-top:6px;}
.act{background:var(--paper-ink);color:var(--paper);border:none;border-radius:8px;padding:9px 16px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;}
.act:hover{opacity:.88;}
.act.ghost{background:none;color:var(--paper-ink);border:1px solid var(--paper-line);}

.slide-stage{display:flex;align-items:center;justify-content:center;gap:14px;}
.nav{flex:none;width:40px;height:40px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);color:var(--text);font-size:22px;cursor:pointer;line-height:1;}
.nav:hover{border-color:var(--brass);color:var(--brass);}
.nav:disabled{opacity:.3;cursor:default;}
.slide-canvas{width:100%;max-width:340px;height:auto;border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.4);display:block;}
.dots{display:flex;justify-content:center;gap:7px;margin:16px 0;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);border:none;cursor:pointer;padding:0;}
.dot.on{background:var(--brass);}

.compliance{margin-top:22px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;}
.comp-head{display:flex;justify-content:space-between;align-items:center;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;color:var(--brass);text-transform:uppercase;margin-bottom:12px;}
.disc-edit{background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;font-size:11px;padding:4px 9px;cursor:pointer;font-family:inherit;letter-spacing:0;text-transform:none;}
.disc-box{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--text);font-family:inherit;font-size:12.5px;padding:9px;margin-bottom:12px;resize:vertical;}
.checks{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:7px 18px;}
@media(max-width:560px){.checks{grid-template-columns:1fr;}}
.checks li{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:flex-start;}
.tick{color:var(--sage);font-size:12px;flex:none;}
.flags{margin-top:14px;border-top:1px solid var(--line);padding-top:12px;}
.flags-head{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.16em;color:var(--brass-dim);margin-bottom:7px;text-transform:uppercase;}
.flag{font-size:12.5px;color:var(--text);background:var(--panel2);border-left:2px solid var(--brass);border-radius:0 6px 6px 0;padding:8px 11px;margin-bottom:6px;}
