// Strip em/en dashes anywhere they slip through.
function deDash(s) {
  if (!s) return s;
  return String(s)
    .replace(/\s*[—–]\s*/g, ", ")
    .replace(/,\s*,/g, ",")
    .replace(/\s+,/g, ",")
    .replace(/,\s*\./g, ".")
    .replace(/,\s*$/g, "");
}

function cleanResult(r) {
  const c = { ...r };
  c.hook = deDash(c.hook);
  c.body = deDash(c.body);
  if (Array.isArray(c.carousel)) {
    c.carousel = c.carousel.map((s) => ({
      ...s,
      title: deDash(s.title),
      summary: deDash(s.summary),
      headline: deDash(s.headline),
      sub: deDash(s.sub),
    }));
  }
  if (Array.isArray(c.reviewer_notes)) c.reviewer_notes = c.reviewer_notes.map(deDash);
  return c;
}

// The exact JSON shape for the carousel array at a given slide count.
function carouselSchema(n) {
  const rows = ['    {"kind": "cover", "title": "...", "summary": "...", "image_prompt": "...", "image_query": "..."}'];
  const points = n >= 3 ? n - 2 : 0;
  for (let k = 0; k < points; k++) rows.push('    {"headline": "...", "sub": "...", "image_prompt": "...", "image_query": "..."}');
  if (n >= 2) rows.push('    {"kind": "close", "title": "...", "sub": "...", "image_prompt": "...", "image_query": "..."}');
  return "[\n" + rows.join(",\n") + "\n  ]";
}

// Plain-language description of the carousel structure at a given slide count.
function carouselSpec(n) {
  if (n <= 1) return "a single COVER slide only: a bold title that makes a complete statement (up to about 12 words) plus a one-sentence summary that finishes the thought. There are NO other slides.";
  if (n === 2) return "a 2 slide carousel. Slide 1 is the COVER (a bold title that makes a complete statement, up to about 12 words, plus a one-sentence summary). Slide 2 is the CLOSER (see the CLOSER RULE).";
  return "a " + n + " slide carousel. Slide 1 is the COVER (a bold title that makes a complete statement, up to about 12 words, plus a one-sentence summary of what the carousel delivers). Slides 2 to " + (n - 1) + " each carry ONE headline that is a COMPLETE THOUGHT, a full statement of up to about 12 words, never a fragment or teaser, plus a supporting subtext of 1 or 2 full sentences (up to about 28 words) that finishes the idea. Each slide must make sense on its own without the caption. Slide " + n + " is the CLOSER (see the CLOSER RULE).";
}

const VOICE_RULES = `WRITE LIKE A REAL PERSON, NOT AI. These rules are strict:
- No inflated verbs. Use "use" not "utilize" or "leverage", "help" not "facilitate", "start" not "commence". NEVER use these words: delve, foster, navigate, robust, myriad, tapestry, landscape, realm, testament.
- No throat-clearing openers such as "It's worth noting", "It's important to remember", "In today's world", "At the end of the day". Say the thing directly.
- NEVER use the "not just X, but Y" or "it's not about X, it's about Y" construction.
- Do not end with a summary sentence that restates what you already said. End on the actual last point.
- No em dashes or en dashes anywhere. Use a period or a comma.
- No forced rule-of-three (like "clear, concise, and compelling"). Do not triple things by default.
- No hedging stacks like "can sometimes potentially help". Say what is true.
- Vary sentence length hard. Mix long sentences with short punchy ones. A three word sentence is fine.
- State opinions plainly. Take a position instead of staying neutral.
- Be concrete. Use real numbers and specific examples over vague phrases like "various factors".
- Use contractions.
- It is fine to start a sentence with "And" or "But" when the rhythm calls for it.
- End with a clear call to action when there is a point to drive home.`;

function formatsAndJson(n, general) {
  return `You will produce TWO formats of the SAME idea:
1) A single LinkedIn text post: a strong scroll-stopping hook line, then short body lines, ending on a clear point. No hashtags in the body.
2) A MINIMALIST image carousel: ${carouselSpec(n)} Every slide carries a complete thought written in real sentences, not clipped fragments like "The hidden cost" or "Why it matters". A reader who sees only that one slide should still learn something whole. Stay glanceable: a headline plus a sentence or two, never a paragraph.${n > 1 ? " The reader swipes the slides, then reads the full post caption for more." : ""}

COVER TITLE RULE: the cover slide's "title" must be a punchy, specific, curiosity-grabbing headline about the topic itself, like a magazine cover line. NEVER use the post category name (such as "Myth vs Fact", "Fact to Lesson", "Concept Demystified", "Behavioral Finance", "Fun Fact", "Holiday") as, or inside, any slide title or the hook. Write about the subject, not the format.

CLOSER RULE: the final slide must stay on the CONTENT and close the loop in an interesting way. Best options: the single most memorable takeaway restated sharply, a surprising kicker detail that reframes the topic, or a thought-provoking question about the subject itself. It must NOT be a call to action or a pitch. NEVER write anything like "contact me", "DM me", "let's chat", "reach out", "message me", "follow for more", "link in bio", "let's talk", "work with me", or any invitation to hire, message, or follow the author. The closer is the topic's mic drop, not an ad.

For EVERY slide, also write an "image_prompt": a vivid, literal description of a single photographic scene that represents that slide's specific idea (a concrete object, place, or moment, not an abstraction). It becomes a real photo shown behind the slide text, so describe only what is in frame. Each image_prompt must be clearly DIFFERENT from the others. The scene must contain NO people: no person, no faces, no hands, no human figures, no crowds. Use objects, places, architecture, nature, or still-life scenes instead. Do NOT mention any text, words, letters, numbers, charts, or logos in the image_prompt. Also write an "image_query": 2 to 4 plain search keywords for a stock photo of that same scene (for example "misty mountain lake" or "marble desk still life"), with no people and no punctuation.

Return ONLY valid JSON, no markdown, no code fences, in exactly this shape:
{
  "hook": "the opening line of the text post",
  "body": "the rest of the text post, newline-separated, no hashtags",
  "hashtags": ["#Tag", "#Tag", "#Tag", "#Tag"],
  "carousel": ${carouselSchema(n)},
  "reviewer_notes": ["${general ? "one thing to fact-check" : "one thing the compliance reviewer should double-check"}", "another"]
}
The "carousel" array MUST contain EXACTLY ${n} slide object(s), no more and no fewer. Keep hashtags to 3 or 4 relevant, non-spammy tags. Keep reviewer_notes to 2 short items specific to THIS post. Remember: no em dashes anywhere.`;
}

function buildSystemPrompt(pillar, tone, words, lenLabel, slideCount) {
  const n = Math.max(1, Math.min(5, slideCount || 5));

  // General (non-finance) pillars: no finance framing, no compliance block.
  if (pillar.general) {
    return `You are a ghostwriter creating fun, engaging, shareable social posts for a person's warm and human personal brand. This post is NOT about finance, money, investing, saving, or business, and must not drift into those topics or add a money "lesson", even if a topic is provided. Keep it genuinely entertaining, positive, inclusive, and clean. Anything you present as a fact must be true and verifiable.

${VOICE_RULES}

VOICE: First person, warm, ${tone}. Playful, human, and real.

LENGTH: The text post must be at most about ${words} words (${lenLabel}). Be concise.

POST TYPE FOR THIS REQUEST: ${pillar.label}. ${pillar.directive}

${formatsAndJson(n, true)}`;
  }

  return `You are a ghostwriter creating LinkedIn posts for a wealth-management financial advisor in the United States. Your output must be SUBMITTABLE to a broker-dealer / RIA compliance review with minimal edits.

NON-NEGOTIABLE COMPLIANCE RULES (spirit of SEC Marketing Rule 206(4)-1 and FINRA Rule 2210):
- Educational and general only. Never give individualized advice or recommend a specific security, product, or action.
- NO specific past performance figures, return percentages, or any promise/implication of future results.
- NO predictions stated as certainty. Prefer "may", "can", "often" over "will".
- NO testimonials, endorsements, or client stories presented as proof.
- NO superlatives or unverifiable claims ("best", "guaranteed", "the only", "risk-free").
- NO fear-mongering or pressure. Balanced and fair.
- Any real-world fact you cite must be accurate and verifiable; if unsure, choose a different fact.

${VOICE_RULES}

VOICE: First person, warm, ${tone}. Confident, plainspoken, human. Written for an intelligent general audience, not for advisors.

LENGTH: The text post must be at most about ${words} words (${lenLabel}). Treat this as a ceiling, never pad toward it. Be as concise as the idea allows.

POST TYPE FOR THIS REQUEST: ${pillar.label}. ${pillar.directive}

${formatsAndJson(n, false)}`;
}

// ---- Canvas slide rendering -------------------------------------------------
function wrap(ctx, text, maxW) {
  const words = String(text || "").split(/\s+/);
  const lines = [];
  let line = "";
  for (const w of words) {
    const t = line ? line + " " + w : w;
    if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; }
    else line = t;
  }
  if (line) lines.push(line);
  return lines;
}

// Shrink the headline until it fits a sane number of lines. Keeps long and
// short slides looking balanced instead of one giant block of text.
function fitText(ctx, text, maxW, font, startSize, minSize, maxLines) {
  let size = startSize;
  let lines = [];
  while (size >= minSize) {
    ctx.font = font.replace("__SIZE__", size + "px");
    lines = wrap(ctx, text, maxW);
    if (lines.length <= maxLines) return { size, lines };
    size -= 4;
  }
  ctx.font = font.replace("__SIZE__", minSize + "px");
  return { size: minSize, lines: wrap(ctx, text, maxW) };
}

// Fit a headline into a fixed height as well as a line count, by trying
// progressively tighter line counts. Keeps a long headline out of the byline.
function fitBlock(ctx, text, maxW, font, startSize, minSize, maxLines, lead, availH) {
  let best = null;
  for (let lines = maxLines; lines >= 2; lines--) {
    const fit = fitText(ctx, text, maxW, font, startSize, minSize, lines);
    best = best || fit;
    if (fit.lines.length * fit.size * lead <= availH) return fit;
  }
  return best;
}

// Largest size that keeps a short string on one line.
function fitOneLine(ctx, text, maxW, font, startSize, minSize) {
  let size = startSize;
  while (size > minSize) {
    ctx.font = font.replace("__SIZE__", size + "px");
    if (ctx.measureText(text).width <= maxW) break;
    size -= 6;
  }
  ctx.font = font.replace("__SIZE__", size + "px");
  return size;
}

function setTracking(ctx, v) {
  try { ctx.letterSpacing = v; } catch (e) {}
}

// Headline helpers, so every layout respects the active pairing: a caps-only
// pairing uppercases, and each pairing scales headline sizes to its own face.
function HT(v, t) { return v.f && v.f.upper ? String(t || "").toUpperCase() : String(t || ""); }
function S(v, n) { return Math.round(n * ((v.f && v.f.size) || 1)); }
function headFont(v) { return v.f.headW + " __SIZE__ " + v.f.head; }
function headAt(v, size) { return v.f.headW + " " + size + "px " + v.f.head; }

// Layouts that want the photograph left alone, with no darkening scrim.
const NO_SCRIM = { silent: true, captioncard: true };

function drawSlide(canvas, slide, i, total, opts, img) {
  const { theme, kicker, brand } = opts;
  const f = opts.fonts || FONT_SETS.journal;
  let template = opts.template;
  const W = 1080, H = 1350, PAD = 104;
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext("2d");
  const kind = slide.kind;
  const isFrame = kind === "cover" || kind === "close";
  const hasImg = !!(img && img.width);
  // A wordless slide needs a photograph. Without one, fall back to type.
  if (template === "silent" && !hasImg) template = "editorial";
  const accent = theme.accent;

  // Color scheme. Over a photo we always use light text on a dark scrim; on a
  // plain slide we use the theme's ink/sub for the cover/close vs inner pages.
  // Caption Card is the exception: its words sit on a paper card, not on the
  // photo, so it keeps the theme's own colors.
  let ink, sub, line;
  if (hasImg && template === "captioncard") {
    ink = theme.ink; sub = theme.sub; line = theme.line;
  } else if (hasImg) {
    ink = "#F7F4ED"; sub = "rgba(247,244,237,0.86)"; line = "rgba(255,255,255,0.30)";
  } else if (isFrame) {
    ink = theme.coverInk; sub = theme.coverSub; line = "rgba(255,255,255,0.14)";
  } else {
    ink = theme.ink; sub = theme.sub; line = theme.line;
  }

  if (hasImg) {
    drawCover(ctx, img, W, H);
    // Vertical scrim tinted with the theme's dark color, so the selected theme
    // still reads through the photo while keeping every line legible. The
    // photo-first layouts skip it and show the picture clean.
    if (!NO_SCRIM[template]) {
      const tint = theme.coverBg;
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, hexToRgba(tint, 0.55));
      g.addColorStop(0.46, hexToRgba(tint, 0.60));
      g.addColorStop(1, hexToRgba(tint, 0.92));
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }
  } else {
    ctx.fillStyle = isFrame ? theme.coverBg : theme.bg;
    ctx.fillRect(0, 0, W, H);
  }
  ctx.textBaseline = "alphabetic";

  // Shared context, then dispatch to the chosen layout template.
  const v = { W, H, PAD, slide, i, total, kind, isFrame, hasImg, kicker, brand, theme, ink, sub, line, accent, f };
  if (template === "broadsheet") drawBroadsheet(ctx, v);
  else if (template === "index") drawIndexLayout(ctx, v);
  else if (template === "ledger") drawLedger(ctx, v);
  else if (template === "feature") drawFeature(ctx, v);
  else if (template === "quote") drawQuote(ctx, v);
  else if (template === "frame") drawFrame(ctx, v);
  else if (template === "split") drawSplit(ctx, v);
  else if (template === "band") drawBand(ctx, v);
  else if (template === "corner") drawCorner(ctx, v);
  else if (template === "dispatch") drawDispatch(ctx, v);
  else if (template === "bulletin") drawBulletin(ctx, v);
  else if (template === "stat") drawStat(ctx, v);
  else if (template === "ticker") drawTicker(ctx, v);
  else if (template === "coverstory") drawCoverStory(ctx, v);
  else if (template === "captioncard") drawCaptionCard(ctx, v);
  else if (template === "column") drawColumn(ctx, v);
  else if (template === "poster") drawPoster(ctx, v);
  else if (template === "silent") { /* the photograph is the slide */ }
  else drawEditorial(ctx, v);
}

// N progress segments along the bottom, filled through the current slide.
function drawProgress(ctx, v) {
  const { W, H, PAD, total, i, accent, line, f } = v;
  if (total <= 1) return; // no progress bar for a one-slide carousel
  const segTop = H - 96, segGap = 9;
  const segW = (W - PAD * 2 - segGap * (total - 1)) / total;
  for (let s = 0; s < total; s++) {
    ctx.fillStyle = s <= i ? accent : line;
    roundRect(ctx, PAD + s * (segW + segGap), segTop, segW, 5, 2.5);
    ctx.fill();
  }
}

// Shared left-aligned footer: hairline rule, brand byline, and a swipe cue or
// accent dot. Used by the left-aligned templates.
function drawFooterLeft(ctx, v, ruleY) {
  const { W, PAD, brand, ink, sub, line, accent, kind, total, f } = v;
  ctx.strokeStyle = line; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(PAD, ruleY); ctx.lineTo(W - PAD, ruleY); ctx.stroke();
  ctx.textAlign = "left";
  ctx.fillStyle = ink; ctx.font = "600 30px " + f.body; ctx.fillText(brand.name, PAD, ruleY + 50);
  ctx.fillStyle = sub; ctx.font = "400 26px " + f.body; ctx.fillText(brand.handle, PAD, ruleY + 88);
  if (kind === "cover" && total > 1) {
    ctx.fillStyle = accent; ctx.font = "500 24px " + f.label; setTracking(ctx, "3px");
    ctx.textAlign = "right"; ctx.fillText("SWIPE →", W - PAD, ruleY + 56); ctx.textAlign = "left"; setTracking(ctx, "0px");
  } else {
    ctx.fillStyle = accent; ctx.beginPath(); ctx.arc(W - PAD - 6, ruleY + 44, 7, 0, Math.PI * 2); ctx.fill();
  }
}

// Template 4: Ledger. A vertical accent rail on the left with a top-anchored
// headline, like a column in a ledger.
function drawLedger(ctx, v) {
  const { W, H, PAD, slide, i, total, kind, ink, sub, accent, f } = v;
  const textX = PAD + 44, maxW = W - textX - PAD;
  const headY = PAD + 26;
  ctx.textAlign = "right"; ctx.fillStyle = sub; ctx.font = "500 26px " + f.label; setTracking(ctx, "2px");
  ctx.fillText(String(i + 1).padStart(2, "0") + " / " + String(total).padStart(2, "0"), W - PAD, headY);
  ctx.textAlign = "left"; setTracking(ctx, "0px");
  const ruleY = H - 232;
  ctx.strokeStyle = accent; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(PAD, headY + 28); ctx.lineTo(PAD, ruleY - 30); ctx.stroke();
  drawFooterLeft(ctx, v, ruleY);
  drawProgress(ctx, v);

  const zoneTop = headY + 72;
  const hFit = fitText(ctx, HT(v, slide.title || slide.headline || ""), maxW, f.headW + " __SIZE__ " + f.head, S(v, kind === "cover" ? 92 : 78), 44, 4);
  const hLine = hFit.size * f.lead;
  ctx.textAlign = "left"; ctx.fillStyle = ink; ctx.font = f.headW + " " + hFit.size + "px " + f.head;
  const y = zoneTop + hFit.size;
  hFit.lines.forEach((ln, k) => ctx.fillText(ln, textX, y + k * hLine));
  const subText = slide.summary || slide.sub || "";
  if (subText) {
    const subSize = 34; ctx.fillStyle = sub; ctx.font = "400 " + subSize + "px " + f.body;
    const sLines = wrap(ctx, subText, maxW).slice(0, 6); const sLine = subSize * 1.4;
    const sy = y + (hFit.lines.length - 1) * hLine + 56;
    sLines.forEach((ln, k) => ctx.fillText(ln, textX, sy + k * sLine));
  }
  if (kind === "close") {
    ctx.fillStyle = sub; ctx.font = "400 22px " + f.label; setTracking(ctx, "1px");
    ctx.fillText("Educational content, not individualized advice.", textX, ruleY - 30);
    setTracking(ctx, "0px");
  }
}

// Template 5: Feature. Headline anchored to the bottom of the frame, leaving
// the top open. Reads like a magazine cover, and sits well over a photo.
function drawFeature(ctx, v) {
  const { W, H, PAD, slide, i, total, kind, ink, sub, f } = v;
  const maxW = W - PAD * 2;
  const headY = PAD + 26;
  ctx.textAlign = "left"; ctx.fillStyle = sub; ctx.font = "500 26px " + f.label; setTracking(ctx, "2px");
  ctx.fillText(String(i + 1).padStart(2, "0") + " / " + String(total).padStart(2, "0"), PAD, headY);
  setTracking(ctx, "0px");
  const ruleY = H - 232;
  drawFooterLeft(ctx, v, ruleY);
  drawProgress(ctx, v);

  const zoneBottom = ruleY - 40;
  const hFit = fitText(ctx, HT(v, slide.title || slide.headline || ""), maxW, f.headW + " __SIZE__ " + f.head, S(v, kind === "cover" ? 104 : 88), 46, 4);
  const hLine = hFit.size * f.lead;
  const subText = slide.summary || slide.sub || "";
  const subSize = 36; ctx.font = "400 " + subSize + "px " + f.body;
  const sLines = subText ? wrap(ctx, subText, maxW).slice(0, 6) : []; const sLine = subSize * 1.4; const gap = sLines.length ? 50 : 0;
  const blockH = hFit.lines.length * hLine + gap + sLines.length * sLine;
  const y = zoneBottom - blockH + hFit.size;
  ctx.textAlign = "left"; ctx.fillStyle = ink; ctx.font = f.headW + " " + hFit.size + "px " + f.head;
  hFit.lines.forEach((ln, k) => ctx.fillText(ln, PAD, y + k * hLine));
  if (sLines.length) {
    const sy = y + (hFit.lines.length - 1) * hLine + gap;
    ctx.fillStyle = sub; ctx.font = "400 " + subSize + "px " + f.body;
    sLines.forEach((ln, k) => ctx.fillText(ln, PAD, sy + k * sLine));
  }
  if (kind === "close") {
    ctx.fillStyle = sub; ctx.font = "400 22px " + f.label; setTracking(ctx, "1px");
    ctx.fillText("Educational content, not individualized advice.", PAD, headY + 48);
    setTracking(ctx, "0px");
  }
}

// Template 6: Quote. An oversized quotation mark frames the headline as a
// pull-quote.
function drawQuote(ctx, v) {
  const { W, H, PAD, slide, i, total, kind, ink, sub, accent, f } = v;
  const maxW = W - PAD * 2;
  const headY = PAD + 26;
  ctx.textAlign = "right"; ctx.fillStyle = sub; ctx.font = "500 26px " + f.label; setTracking(ctx, "2px");
  ctx.fillText(String(i + 1).padStart(2, "0") + " / " + String(total).padStart(2, "0"), W - PAD, headY);
  ctx.textAlign = "left"; setTracking(ctx, "0px");
  const ruleY = H - 232;
  drawFooterLeft(ctx, v, ruleY);
  drawProgress(ctx, v);

  ctx.textAlign = "left"; ctx.fillStyle = accent;
  ctx.font = "600 230px " + f.head; ctx.globalAlpha = 0.9;
  ctx.fillText("“", PAD - 12, PAD + 190); ctx.globalAlpha = 1;

  const zoneTop = PAD + 210, zoneBot = ruleY - 20;
  const hFit = fitText(ctx, HT(v, slide.title || slide.headline || ""), maxW, f.headW + " __SIZE__ " + f.head, S(v, kind === "cover" ? 84 : 72), 44, 4);
  const hLine = hFit.size * f.lead;
  const subText = slide.summary || slide.sub || "";
  const subSize = 32; ctx.font = "400 " + subSize + "px " + f.body;
  const sLines = subText ? wrap(ctx, subText, maxW).slice(0, 6) : []; const sLine = subSize * 1.4; const gap = sLines.length ? 46 : 0;
  const blockH = hFit.lines.length * hLine + gap + sLines.length * sLine;
  const y = zoneTop + Math.max(0, (zoneBot - zoneTop - blockH) / 2) + hFit.size;
  ctx.fillStyle = ink; ctx.font = f.headW + " " + hFit.size + "px " + f.head;
  hFit.lines.forEach((ln, k) => ctx.fillText(ln, PAD, y + k * hLine));
  if (sLines.length) {
    const sy = y + (hFit.lines.length - 1) * hLine + gap;
    ctx.fillStyle = sub; ctx.font = "400 " + subSize + "px " + f.body;
    sLines.forEach((ln, k) => ctx.fillText(ln, PAD, sy + k * sLine));
  }
  if (kind === "close") {
    ctx.fillStyle = sub; ctx.font = "400 22px " + f.label; setTracking(ctx, "1px");
    ctx.fillText("Educational content, not individualized advice.", PAD, Math.min(y + blockH + 52, ruleY - 24));
    setTracking(ctx, "0px");
  }
}

// Template 1: Editorial. Kicker + index header rule, left-aligned headline
// optically centered, brand byline footer.
function drawEditorial(ctx, v) {
  const { W, H, PAD, slide, i, total, kind, brand, ink, sub, line, accent, f } = v;
  const headY = PAD + 26;
  ctx.textAlign = "right";
  ctx.fillStyle = sub; ctx.font = "500 26px " + f.label; setTracking(ctx, "2px");
  ctx.fillText(String(i + 1).padStart(2, "0") + " / " + String(total).padStart(2, "0"), W - PAD, headY);
  ctx.textAlign = "left"; setTracking(ctx, "0px");
  ctx.strokeStyle = line; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(PAD, headY + 34); ctx.lineTo(W - PAD, headY + 34); ctx.stroke();

  const ruleY = H - 232;
  ctx.strokeStyle = line; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(PAD, ruleY); ctx.lineTo(W - PAD, ruleY); ctx.stroke();
  ctx.fillStyle = ink; ctx.font = "600 30px " + f.body; ctx.fillText(brand.name, PAD, ruleY + 50);
  ctx.fillStyle = sub; ctx.font = "400 26px " + f.body; ctx.fillText(brand.handle, PAD, ruleY + 88);
  if (kind === "cover" && total > 1) {
    ctx.fillStyle = accent; ctx.font = "500 24px " + f.label; setTracking(ctx, "3px");
    ctx.textAlign = "right"; ctx.fillText("SWIPE →", W - PAD, ruleY + 56); ctx.textAlign = "left"; setTracking(ctx, "0px");
  } else {
    ctx.fillStyle = accent; ctx.beginPath(); ctx.arc(W - PAD - 6, ruleY + 44, 7, 0, Math.PI * 2); ctx.fill();
  }
  drawProgress(ctx, v);

  const maxW = W - PAD * 2;
  const hFit = fitText(ctx, HT(v, slide.title || slide.headline || ""), maxW, f.headW + " __SIZE__ " + f.head, S(v, kind === "cover" ? 104 : 88), 46, 4);
  const hLine = hFit.size * f.lead;
  const subText = slide.summary || slide.sub || "";
  const subSize = 36; ctx.font = "400 " + subSize + "px " + f.body;
  const sLines = subText ? wrap(ctx, subText, maxW).slice(0, 6) : [];
  const sLine = subSize * 1.4; const gap = sLines.length ? 54 : 0;
  const blockH = hFit.lines.length * hLine + gap + sLines.length * sLine;
  const zoneTop = headY + 34, zoneBot = ruleY;
  let y = zoneTop + (zoneBot - zoneTop - blockH) / 2 + hFit.size;
  ctx.fillStyle = ink; ctx.font = f.headW + " " + hFit.size + "px " + f.head;
  hFit.lines.forEach((ln, k) => ctx.fillText(ln, PAD, y + k * hLine));
  if (sLines.length) {
    const sy = y + (hFit.lines.length - 1) * hLine + gap;
    ctx.fillStyle = sub; ctx.font = "400 " + subSize + "px " + f.body;
    sLines.forEach((ln, k) => ctx.fillText(ln, PAD, sy + k * sLine));
  }
  if (kind === "close") {
    ctx.fillStyle = sub; ctx.font = "400 22px " + f.label; setTracking(ctx, "1px");
    ctx.fillText("Educational content, not individualized advice.", PAD, Math.min(y + blockH + 64, ruleY - 28));
    setTracking(ctx, "0px");
  }
}

// Template 2: Broadsheet. A centered newspaper masthead with hairline rules,
// a centered serif headline, and a centered byline. Wall Street Journal feel.
function drawBroadsheet(ctx, v) {
  const { W, H, PAD, slide, i, total, kind, brand, ink, sub, line, accent, f } = v;
  const cx = W / 2, maxW = W - PAD * 2;
  ctx.textAlign = "center";

  const topY = PAD + 20;
  ctx.strokeStyle = line; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(PAD, topY); ctx.lineTo(W - PAD, topY);
  ctx.moveTo(PAD, topY + 6); ctx.lineTo(W - PAD, topY + 6); ctx.stroke();
  const drY = topY + 6;
  ctx.fillStyle = sub; ctx.font = "400 23px " + f.label; setTracking(ctx, "3px");
  ctx.fillText("NO. " + String(i + 1).padStart(2, "0") + " OF " + String(total).padStart(2, "0"), cx, drY + 44);
  setTracking(ctx, "0px");

  const ruleY = H - 232;
  ctx.strokeStyle = line; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(cx - 64, ruleY); ctx.lineTo(cx + 64, ruleY); ctx.stroke();
  ctx.fillStyle = ink; ctx.font = "600 30px " + f.body; ctx.fillText(brand.name, cx, ruleY + 52);
  ctx.fillStyle = sub; ctx.font = "400 26px " + f.body; ctx.fillText(brand.handle, cx, ruleY + 90);
  drawProgress(ctx, v);

  const zoneTop = drY + 92, zoneBot = ruleY - 28;
  const hFit = fitText(ctx, HT(v, slide.title || slide.headline || ""), maxW, f.headW + " __SIZE__ " + f.head, S(v, kind === "cover" ? 96 : 82), 44, 4);
  const hLine = hFit.size * f.lead;
  const subText = slide.summary || slide.sub || "";
  const subSize = 32; ctx.font = "400 " + subSize + "px " + f.body;
  const sLines = subText ? wrap(ctx, subText, maxW - 60).slice(0, 6) : [];
  const sLine = subSize * 1.4; const gap = sLines.length ? 44 : 0;
  const blockH = hFit.lines.length * hLine + gap + sLines.length * sLine;
  let y = zoneTop + (zoneBot - zoneTop - blockH) / 2 + hFit.size;
  ctx.fillStyle = ink; ctx.font = f.headW + " " + hFit.size + "px " + f.head;
  hFit.lines.forEach((ln, k) => ctx.fillText(ln, cx, y + k * hLine));
  if (sLines.length) {
    const sy = y + (hFit.lines.length - 1) * hLine + gap;

// "#RRGGBB" + alpha -> "rgba(r,g,b,a)". Used to tint the photo scrim with the
// active theme so each theme keeps its own mood even behind a photo.
function hexToRgba(hex, a) {
  const h = String(hex || "#000000").replace("#", "");
  const r = parseInt(h.slice(0, 2), 16) || 0;
  const g = parseInt(h.slice(2, 4), 16) || 0;
  const b = parseInt(h.slice(4, 6), 16) || 0;
  return `rgba(${r},${g},${b},${a})`;
}

// Draw an image to fully cover w x h (like CSS background-size: cover).
function drawCover(ctx, img, w, h) {
  const ir = img.width / img.height;
  const r = w / h;
  let dw, dh, dx, dy;
  if (ir > r) { dh = h; dw = h * ir; dx = (w - dw) / 2; dy = 0; }
  else { dw = w; dh = w / ir; dx = 0; dy = (h - dh) / 2; }
  ctx.drawImage(img, dx, dy, dw, dh);
}

// Pull a leading figure out of a sentence so it can be set large.
function splitStat(text) {
  const s = String(text || "").trim();
  const m = s.match(/\$?\d[\d,]*(\.\d+)?\s*(%|x|k|m|bn|percent)?/i);
  if (!m) return { num: "", rest: s };
  const num = m[0].trim();
  const rest = (s.slice(0, m.index) + s.slice(m.index + m[0].length)).replace(/\s{2,}/g, " ").replace(/^[\s,.;:]+/, "").trim();
  return { num, rest: rest || s };
}

// ---------------------------------------------------------------------------
// Template 14: Ticker. An accent rule across the very top, a monospace
// dateline, and a tight headline over a strip of ticks. Market-wire feel.
// ---------------------------------------------------------------------------
function drawTicker(ctx, v) {
  const { W, H, PAD, slide, i, total, kind, kicker, ink, sub, line, accent, f } = v;
  const maxW = W - PAD * 2;
  ctx.fillStyle = accent; ctx.fillRect(0, 0, W, 14);
  const headY = PAD + 34;
  ctx.fillStyle = accent; ctx.fillRect(PAD, headY - 18, 18, 18);
  ctx.fillStyle = sub; ctx.font = "400 25px " + f.label; setTracking(ctx, "3px"); ctx.textAlign = "left";
  ctx.fillText(String(kicker || "").toUpperCase().slice(0, 24), PAD + 34, headY - 2);
  ctx.textAlign = "right";
  ctx.fillText(String(i + 1).padStart(2, "0") + "/" + String(total).padStart(2, "0"), W - PAD, headY - 2);
  ctx.textAlign = "left"; setTracking(ctx, "0px");

  const ruleY = H - 232;
  drawFooterLeft(ctx, v, ruleY);
  drawProgress(ctx, v);

  const zoneTop = headY + 110;
  setTracking(ctx, f.track || "0px");
  const hFit = fitText(ctx, HT(v, slide.title || slide.headline || ""), maxW, headFont(v), S(v, kind === "cover" ? 96 : 84), 44, 4);
  const hLine = hFit.size * f.lead;
  ctx.fillStyle = ink; ctx.font = f.headW + " " + hFit.size + "px " + f.head;
  const y = zoneTop + hFit.size;
  hFit.lines.forEach((ln, k) => ctx.fillText(ln, PAD, y + k * hLine));
  setTracking(ctx, "0px");

  const stripY = y + (hFit.lines.length - 1) * hLine + 56;
  for (let t = 0; t < 22; t++) {
    ctx.fillStyle = t % 3 === 0 ? accent : line;
    ctx.fillRect(PAD + t * 38, stripY, 16, 4);
  }
  const subText = slide.summary || slide.sub || "";
  if (subText) {
    const subSize = 33; ctx.fillStyle = sub; ctx.font = "400 " + subSize + "px " + f.body;
    const sLines = wrap(ctx, subText, maxW).slice(0, 6); const sLine = subSize * 1.44;
    sLines.forEach((ln, k) => ctx.fillText(ln, PAD, stripY + 74 + k * sLine));
  }
  if (kind === "close") {
    ctx.fillStyle = sub; ctx.font = "400 22px " + f.label;
    ctx.fillText("Educational content, not individualized advice.", PAD, ruleY - 34);
  }
}

// ---------------------------------------------------------------------------
// Template 15: Cover Story. A wide letterspaced masthead across the top,
// then the headline anchored low over a full-width rule. Magazine cover.
// ---------------------------------------------------------------------------
function drawCoverStory(ctx, v) {
  const { W, H, PAD, slide, i, total, kind, kicker, ink, sub, line, accent, f } = v;
  const maxW = W - PAD * 2;
  const mastY = PAD + 66;
  ctx.textAlign = "center"; setTracking(ctx, "14px");
  const mast = String(kicker || "The Desk").toUpperCase().slice(0, 18);
  const mSize = fitOneLine(ctx, mast, maxW, "500 __SIZE__ " + f.head, 78, 34);
  ctx.fillStyle = ink; ctx.font = "500 " + mSize + "px " + f.head;
  ctx.fillText(mast, W / 2 + 7, mastY);
  setTracking(ctx, "0px");
  ctx.strokeStyle = line; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(PAD, mastY + 34); ctx.lineTo(W - PAD, mastY + 34); ctx.stroke();
  ctx.textAlign = "left";
  ctx.fillStyle = sub; ctx.font = "400 24px " + f.label; setTracking(ctx, "3px");
  ctx.fillText("NO. " + String(i + 1).padStart(2, "0"), PAD, mastY + 76);
  ctx.textAlign = "right"; ctx.fillText("OF " + String(total).padStart(2, "0"), W - PAD, mastY + 76);
  ctx.textAlign = "left"; setTracking(ctx, "0px");

  const ruleY = H - 232;
  drawFooterLeft(ctx, v, ruleY);
  drawProgress(ctx, v);

  const subText = slide.summary || slide.sub || "";
  setTracking(ctx, f.track || "0px");
  const hFit = fitText(ctx, HT(v, slide.title || slide.headline || ""), maxW, headFont(v), S(v, kind === "cover" ? 104 : 90), 46, 4);
  const hLine = hFit.size * f.lead;
  setTracking(ctx, "0px");
  const subSize = 32; ctx.font = "400 " + subSize + "px " + f.body;
  const sLines = subText ? wrap(ctx, subText, maxW * 0.94).slice(0, 5) : [];
  const sLine = subSize * 1.45, gap = sLines.length ? 52 : 0;
  const blockH = hFit.lines.length * hLine + gap + sLines.length * sLine;
  // Anchored low, like a cover line, but not jammed against the byline.
  const zoneTop = mastY + 130, zoneBot = ruleY - 56;
  const y = zoneTop + Math.max(0, (zoneBot - zoneTop - blockH) * 0.72) + hFit.size;
  ctx.fillStyle = accent; ctx.fillRect(PAD, y - hFit.size - 44, maxW, 5);
  ctx.fillStyle = ink; ctx.font = f.headW + " " + hFit.size + "px " + f.head;
  setTracking(ctx, f.track || "0px");
  hFit.lines.forEach((ln, k) => ctx.fillText(ln, PAD, y + k * hLine));
  setTracking(ctx, "0px");
  if (sLines.length) {
    ctx.fillStyle = sub; ctx.font = "400 " + subSize + "px " + f.body;
    const sy = y + (hFit.lines.length - 1) * hLine + gap;
    sLines.forEach((ln, k) => ctx.fillText(ln, PAD, sy + k * sLine));
  }
}

// ---------------------------------------------------------------------------
// Template 16: Caption Card. The photograph runs clean across the top with
// no scrim, and the words sit on a paper card below it, like a picture desk
// caption. Without a photo the top becomes a solid color plate.
// ---------------------------------------------------------------------------
function drawCaptionCard(ctx, v) {
  const { W, H, PAD, slide, i, total, kind, kicker, theme, hasImg, accent, f, brand } = v;
  const cardTop = Math.round(H * 0.55);
  if (!hasImg) {
    ctx.fillStyle = theme.coverBg; ctx.fillRect(0, 0, W, cardTop);
    ctx.fillStyle = theme.coverSub; ctx.font = "400 26px " + f.label; setTracking(ctx, "4px");
    ctx.fillText(String(kicker || "").toUpperCase().slice(0, 26), PAD, PAD + 30);
    setTracking(ctx, "0px");
    ctx.fillStyle = accent; ctx.fillRect(PAD, cardTop - 118, 96, 5);
  }
  ctx.fillStyle = theme.bg; ctx.fillRect(0, cardTop, W, H - cardTop);
  ctx.fillStyle = accent; ctx.fillRect(0, cardTop, W, 6);

  const ink = theme.ink, sub = theme.sub, line = theme.line;
  const maxW = W - PAD * 2;
  ctx.textAlign = "left";
  ctx.fillStyle = accent; ctx.font = "500 23px " + f.label; setTracking(ctx, "3px");
  ctx.fillText(String(kicker || "").toUpperCase().slice(0, 26), PAD, cardTop + 64);
  ctx.textAlign = "right"; ctx.fillStyle = sub;
  ctx.fillText(String(i + 1).padStart(2, "0") + " / " + String(total).padStart(2, "0"), W - PAD, cardTop + 64);
  ctx.textAlign = "left"; setTracking(ctx, "0px");

  // The card is a fixed box, so the type has to be measured against it or it
  // will run into the byline.
  const ruleY = H - 150;
  const textTop = cardTop + 112, textBot = ruleY - 34;
  const subText = slide.summary || slide.sub || "";
  const subSize = 29, sLine = subSize * 1.42;
  setTracking(ctx, f.track || "0px");
  const hFit = fitBlock(ctx, HT(v, slide.title || slide.headline || ""), maxW, headFont(v),
                        S(v, 60), 34, 3, f.lead, (textBot - textTop) * (subText ? 0.5 : 0.9));
  const hLine = hFit.size * f.lead;
  ctx.fillStyle = ink; ctx.font = f.headW + " " + hFit.size + "px " + f.head;
  const y = textTop + hFit.size;
  hFit.lines.forEach((ln, k) => ctx.fillText(ln, PAD, y + k * hLine));
  setTracking(ctx, "0px");

  if (subText) {
    ctx.fillStyle = sub; ctx.font = "400 " + subSize + "px " + f.body;
    const sy = y + (hFit.lines.length - 1) * hLine + 46;
    const room = Math.max(0, Math.floor((textBot - sy) / sLine) + 1);
    const sLines = wrap(ctx, subText, maxW).slice(0, Math.min(4, room));
    sLines.forEach((ln, k) => ctx.fillText(ln, PAD, sy + k * sLine));
  }
  ctx.strokeStyle = line; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(PAD, ruleY); ctx.lineTo(W - PAD, ruleY); ctx.stroke();
  ctx.fillStyle = ink; ctx.font = "600 28px " + f.body; ctx.fillText(brand.name, PAD, ruleY + 46);
  ctx.fillStyle = sub; ctx.font = "400 24px " + f.body;
  ctx.textAlign = "right"; ctx.fillText(brand.handle, W - PAD, ruleY + 46); ctx.textAlign = "left";
  if (total > 1) {
    const segGap = 9, segW = (W - PAD * 2 - segGap * (total - 1)) / total;
    for (let s = 0; s < total; s++) {
      ctx.fillStyle = s <= i ? accent : line;
      roundRect(ctx, PAD + s * (segW + segGap), H - 78, segW, 5, 2.5); ctx.fill();
    }
  }
}

// ---------------------------------------------------------------------------
// Template 17: Column. Text set in a single narrow column against a vertical
// hairline, with rules top and bottom. The most print-like of the set.
// ---------------------------------------------------------------------------
function drawColumn(ctx, v) {
  const { W, H, PAD, slide, i, total, kind, kicker, ink, sub, line, accent, f } = v;
  const colW = Math.round((W - PAD * 2) * 0.68);
  const topRule = PAD + 54, botRule = H - 300;
  ctx.strokeStyle = line; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(PAD, topRule); ctx.lineTo(W - PAD, topRule);
  ctx.moveTo(PAD, botRule); ctx.lineTo(W - PAD, botRule);
  ctx.moveTo(PAD + colW + 46, topRule + 26); ctx.lineTo(PAD + colW + 46, botRule - 26); ctx.stroke();

  ctx.fillStyle = accent; ctx.font = "500 24px " + f.label; setTracking(ctx, "3px"); ctx.textAlign = "left";
  ctx.fillText(String(kicker || "").toUpperCase().slice(0, 22), PAD, topRule - 24);
  ctx.textAlign = "right"; ctx.fillStyle = sub;
  ctx.fillText(String(i + 1).padStart(2, "0") + " / " + String(total).padStart(2, "0"), W - PAD, topRule - 24);
  ctx.textAlign = "left"; setTracking(ctx, "0px");

  const ruleY = H - 232;
  drawFooterLeft(ctx, v, ruleY);
  drawProgress(ctx, v);

  setTracking(ctx, f.track || "0px");
  const hFit = fitText(ctx, HT(v, slide.title || slide.headline || ""), colW, headFont(v), S(v, kind === "cover" ? 82 : 72), 40, 5);
  const hLine = hFit.size * f.lead;
  setTracking(ctx, "0px");
  const subText = slide.summary || slide.sub || "";
  const subSize = 31; ctx.font = "400 " + subSize + "px " + f.body;
  const sLines = subText ? wrap(ctx, subText, colW).slice(0, 6) : [];
  const sLine = subSize * 1.46, gap = sLines.length ? 44 : 0;
  const blockH = hFit.lines.length * hLine + gap + sLines.length * sLine;
  const y = topRule + 30 + Math.max(0, (botRule - topRule - 60 - blockH) / 2) + hFit.size;
  ctx.fillStyle = ink; ctx.font = f.headW + " " + hFit.size + "px " + f.head;
  setTracking(ctx, f.track || "0px");
  hFit.lines.forEach((ln, k) => ctx.fillText(ln, PAD, y + k * hLine));
  setTracking(ctx, "0px");
  if (sLines.length) {
    ctx.fillStyle = sub; ctx.font = "400 " + subSize + "px " + f.body;
    const sy = y + (hFit.lines.length - 1) * hLine + gap;
    sLines.forEach((ln, k) => ctx.fillText(ln, PAD, sy + k * sLine));
  }
}

// ---------------------------------------------------------------------------
// Template 18: Poster. One uppercase headline set edge to edge with tight
// leading and almost no other furniture. Built to stop a scroll.
// ---------------------------------------------------------------------------
function drawPoster(ctx, v) {
  const { W, H, PAD, slide, i, total, kind, kicker, ink, sub, line, accent, f } = v;
  const maxW = W - PAD * 2;
  const headY = PAD + 20;
  ctx.fillStyle = sub; ctx.font = "500 24px " + f.label; setTracking(ctx, "3px"); ctx.textAlign = "left";
  ctx.fillText(String(kicker || "").toUpperCase().slice(0, 22), PAD, headY);
  ctx.textAlign = "right";
  ctx.fillText(String(i + 1).padStart(2, "0") + " / " + String(total).padStart(2, "0"), W - PAD, headY);
  ctx.textAlign = "left"; setTracking(ctx, "0px");

  const ruleY = H - 232;
  drawFooterLeft(ctx, v, ruleY);
  drawProgress(ctx, v);

  const subText = slide.summary || slide.sub || "";
  setTracking(ctx, f.track || "-1px");
  const text = String(slide.title || slide.headline || "").toUpperCase();
  const subLead = subText ? 200 : 60;
  const hFit = fitBlock(ctx, text, maxW, f.headW + " __SIZE__ " + f.head, S(v, 132), 52, 6,
                        Math.min(f.lead, 1.06), (ruleY - 40) - (headY + 70) - subLead);
  const hLine = hFit.size * Math.min(f.lead, 1.06);
  setTracking(ctx, "0px");
  const subSize = 31; ctx.font = "400 " + subSize + "px " + f.body;
  const sLines = subText ? wrap(ctx, subText, maxW).slice(0, 4) : [];
  const sLine = subSize * 1.44, gap = sLines.length ? 60 : 0;
  const blockH = hFit.lines.length * hLine + 34 + gap + sLines.length * sLine;
  const zoneTop = headY + 70, zoneBot = ruleY - 40;
  const y = zoneTop + Math.max(0, (zoneBot - zoneTop - blockH) / 2) + hFit.size;
  ctx.fillStyle = ink; ctx.font = f.headW + " " + hFit.size + "px " + f.head;
  setTracking(ctx, f.track || "-1px");
  hFit.lines.forEach((ln, k) => ctx.fillText(ln, PAD, y + k * hLine));
  setTracking(ctx, "0px");
  const afterHead = y + (hFit.lines.length - 1) * hLine + 34;
  ctx.fillStyle = accent; ctx.fillRect(PAD, afterHead, 220, 8);
  if (sLines.length) {
    ctx.fillStyle = sub; ctx.font = "400 " + subSize + "px " + f.body;
    sLines.forEach((ln, k) => ctx.fillText(ln, PAD, afterHead + 78 + k * sLine));
  }
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function downloadCanvas(canvas, name) {
  // JPEG at high quality: the user's compliance system only accepts JPG/JPEG.
  canvas.toBlob((b) => {
    const u = URL.createObjectURL(b);
    const a = document.createElement("a");
    a.href = u; a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(u), 1000);
  }, "image/jpeg", 0.95);
}

function downloadBlob(blob, name) {
  const u = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = u; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(u), 1500);
}

// Read a fetched image Blob into a data URL, so drawing it never taints the
// canvas and the slide can still be exported to PNG.
function blobToDataUrl(blob) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(fr.result);
    fr.onerror = rej;
    fr.readAsDataURL(blob);
  });
}

// Decode the base64 payload of a data URL into raw bytes.
function dataUrlBytes(dataUrl) {
  const bin = atob(dataUrl.slice(dataUrl.indexOf(",") + 1));
  const u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return u;
}

// Re-encode any image data URL as JPEG at the given quality, optionally
// capping the long side (webhook payloads must stay under ~5MB or the whole
// send is rejected). Downloads and the PDF stay full quality.
function toJpegDataUrl(dataUrl, q, maxSide) {
  return new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => {
      let w = im.naturalWidth, h = im.naturalHeight;
      const long = Math.max(w, h);
      if (maxSide && long > maxSide) {
        const k = maxSide / long;
        w = Math.round(w * k); h = Math.round(h * k);
      }
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      const x = c.getContext("2d");
      x.imageSmoothingQuality = "high";
      x.fillStyle = "#ffffff"; x.fillRect(0, 0, w, h);
      x.drawImage(im, 0, 0, w, h);
      res(c.toDataURL("image/jpeg", q));
    };
    im.onerror = rej;
    im.src = dataUrl;
  });
}

// LinkedIn's post commentary uses "little text format" where these characters
// are control characters; unescaped they can make the API reject the post.
function escapeLTF(s) {
  return String(s || "").replace(/[\\|{}@\[\]()<>*_~]/g, (c) => "\\" + c);
}

// Push one planned post to the user's automation webhook as clean form fields.
// Images travel as {"list":[base64...]} JPEG capped at 1440px, so five photos
// stay safely under webhook size limits (platforms serve ~1080px anyway).
async function sendItemToWebhook(item, webhookUrl, includeImages, liToken) {
  const params = new URLSearchParams();
  params.set("caption", item.caption || "");
  params.set("platforms", (item.platforms || []).join(","));
  params.set("date", item.date || "");
  params.set("time", item.time || "");
  const list = [];
  const rawList = [];
  if (includeImages) {
    for (const d of (item.images || [])) {
      const j = await toJpegDataUrl(d, 0.87, 1440);
      const b64 = j.slice(j.indexOf(",") + 1);
      rawList.push(b64);
      // Pre-percent-encode the base64 so the automation can drop it straight
      // into a form body (image={{value}}) with no encoding function. Make's
      // encodeURL leaves "+" bare, which servers decode as a space and corrupt
      // the image, so we don't trust any downstream encoder.
      list.push(encodeURIComponent(b64));
    }
  }
  params.set("images", JSON.stringify({ list }));
  // For LinkedIn document carousels: the same slides bundled as a PDF, so an
  // automation with LinkedIn API access can post it without any manual step.
  if (rawList.length && (item.platforms || []).includes("linkedin")) {
    const pdfDataUrl = await blobToDataUrl(makePdf(rawList.map((b) => "data:image/jpeg;base64," + b)));
    params.set("pdf", pdfDataUrl.slice(pdfDataUrl.indexOf(",") + 1));
    // With a LinkedIn API token, the automation can publish the PDF as a real
    // document carousel. The app builds the whole Posts API body here (JSON
    // and commentary escaping included) so the automation only fills in two
    // placeholders: __SUB__ (member id) and __DOCURN__ (uploaded document).
    if ((liToken || "").trim()) {
      params.set("li_token", liToken.trim());
      const title = escapeLTF((item.caption || "Carousel").split("\n")[0].slice(0, 60)) || "Carousel";
      params.set("li_post_body", JSON.stringify({
        author: "urn:li:person:__SUB__",
        commentary: escapeLTF(item.caption || ""),
        visibility: "PUBLIC",
        distribution: { feedDistribution: "MAIN_FEED", targetEntities: [], thirdPartyDistributionChannels: [] },
        content: { media: { title: title, id: "__DOCURN__" } },
        lifecycleState: "PUBLISHED",
        isReshareDisabledByAuthor: false,
      }));
    }
  }
  await fetch(webhookUrl, {
    method: "POST", mode: "no-cors",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: params.toString(),
  });
}

// Keep uploaded photos at the best quality that still posts well: originals
// are kept as-is up to 2160px on the long side, larger ones are downscaled
// with high-quality resampling (platforms max out well below that anyway).
function normalizeUpload(dataUrl) {
  return new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => {
      const maxSide = 2160;
      const long = Math.max(im.naturalWidth, im.naturalHeight);
      if (long <= maxSide) return res(dataUrl);
      const k = maxSide / long;
      const c = document.createElement("canvas");
      c.width = Math.round(im.naturalWidth * k);
      c.height = Math.round(im.naturalHeight * k);
      const x = c.getContext("2d");
      x.imageSmoothingQuality = "high";
      x.fillStyle = "#ffffff"; x.fillRect(0, 0, c.width, c.height);
      x.drawImage(im, 0, 0, c.width, c.height);
      res(c.toDataURL("image/jpeg", 0.95));
    };
    im.onerror = rej;
    im.src = dataUrl;
  });
}

// Read pixel dimensions straight from JPEG bytes (the SOF marker), so each
// PDF page can match its image's true aspect ratio.
function jpegDims(bytes) {
  let i = 2;
  while (i < bytes.length - 9) {
    if (bytes[i] !== 0xFF) { i++; continue; }
    const t = bytes[i + 1];
    if (t >= 0xC0 && t <= 0xCF && t !== 0xC4 && t !== 0xC8 && t !== 0xCC) {
      return { h: (bytes[i + 5] << 8) | bytes[i + 6], w: (bytes[i + 7] << 8) | bytes[i + 8] };
    }
    i += 2 + ((bytes[i + 2] << 8) | bytes[i + 3]);
  }
  return { w: 1080, h: 1350 };
}

// Minimal dependency-free PDF: one JPEG per page (DCTDecode passthrough),
// each page sized to its own image so nothing is stretched. This is how a
// LinkedIn "document" carousel is made from the slides.
function makePdf(jpegDataUrls) {
  const enc = new TextEncoder();
  const parts = [];
  let offset = 0;
  const offsets = [];
  const push = (x) => { const b = typeof x === "string" ? enc.encode(x) : x; parts.push(b); offset += b.length; };
  push("%PDF-1.4\n");
  const n = jpegDataUrls.length;
  const total = 2 + n * 3;
  const kids = Array.from({ length: n }, (_, i) => (3 + 3 * i) + " 0 R").join(" ");
  offsets.push(offset); push("1 0 obj\n<</Type/Catalog/Pages 2 0 R>>\nendobj\n");
  offsets.push(offset); push("2 0 obj\n<</Type/Pages/Kids[" + kids + "]/Count " + n + ">>\nendobj\n");
  for (let i = 0; i < n; i++) {
    const jb = dataUrlBytes(jpegDataUrls[i]);
    const d = jpegDims(jb);
    const W = Math.max(1, Math.round(d.w / 2)), H = Math.max(1, Math.round(d.h / 2)); // points
    const pageN = 3 + 3 * i, contN = 4 + 3 * i, imgN = 5 + 3 * i;
    offsets.push(offset);
    push(pageN + " 0 obj\n<</Type/Page/Parent 2 0 R/MediaBox[0 0 " + W + " " + H + "]/Resources<</XObject<</Im" + i + " " + imgN + " 0 R>>>>/Contents " + contN + " 0 R>>\nendobj\n");
    const cs = "q " + W + " 0 0 " + H + " 0 0 cm /Im" + i + " Do Q";
    offsets.push(offset);
    push(contN + " 0 obj\n<</Length " + cs.length + ">>\nstream\n" + cs + "\nendstream\nendobj\n");
    offsets.push(offset);
    push(imgN + " 0 obj\n<</Type/XObject/Subtype/Image/Width " + d.w + "/Height " + d.h + "/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length " + jb.length + ">>\nstream\n");
    push(jb);
    push("\nendstream\nendobj\n");
  }
  const xrefStart = offset;
  let xref = "xref\n0 " + (total + 1) + "\n0000000000 65535 f \n";
  for (const o of offsets) xref += String(o).padStart(10, "0") + " 00000 n \n";
  push(xref);
  push("trailer\n<</Size " + (total + 1) + "/Root 1 0 R>>\nstartxref\n" + xrefStart + "\n%%EOF");
  return new Blob(parts, { type: "application/pdf" });
}

// --- Minimal, dependency-free ZIP (store method) -----------------------------
// PNGs are already compressed, so storing them uncompressed is fine and keeps
// this a single self-contained file with no extra library.
function crc32(bytes) {
  let table = crc32.table;
  if (!table) {
    table = crc32.table = [];
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
      table[n] = c >>> 0;
    }
  }
  let crc = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) crc = (crc >>> 8) ^ table[(crc ^ bytes[i]) & 0xFF];
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

function concatBytes(arrs) {
  let len = 0; for (const a of arrs) len += a.length;
  const out = new Uint8Array(len); let o = 0;
  for (const a of arrs) { out.set(a, o); o += a.length; }
  return out;
}

function makeZip(files) {
  const enc = new TextEncoder();
  const u16 = (n) => new Uint8Array([n & 255, (n >> 8) & 255]);
  const u32 = (n) => new Uint8Array([n & 255, (n >> 8) & 255, (n >> 16) & 255, (n >>> 24) & 255]);
  const locals = [], centrals = [];
  let offset = 0;
  for (const f of files) {
    const name = enc.encode(f.name);
    const crc = crc32(f.data), size = f.data.length;
    const local = concatBytes([
      u32(0x04034b50), u16(20), u16(0), u16(0), u16(0), u16(0),
      u32(crc), u32(size), u32(size), u16(name.length), u16(0), name, f.data,
    ]);
    locals.push(local);
    centrals.push(concatBytes([
      u32(0x02014b50), u16(20), u16(20), u16(0), u16(0), u16(0), u16(0),
      u32(crc), u32(size), u32(size), u16(name.length), u16(0), u16(0), u16(0), u16(0),
      u32(0), u32(offset), name,
    ]));
    offset += local.length;
  }
  const centralStart = offset;
  let centralSize = 0; for (const c of centrals) centralSize += c.length;
  const eocd = concatBytes([
    u32(0x06054b50), u16(0), u16(0), u16(files.length), u16(files.length),
    u32(centralSize), u32(centralStart), u16(0),
  ]);
  return new Blob([...locals, ...centrals, eocd], { type: "application/zip" });
}

// Small live thumbnail of a slide. Renders the real drawSlide so the strip is
// an exact preview, and clicking it jumps to that slide in the carousel tab.
function SlideThumb({ slide, i, total, opts, img, ready, active, onClick }) {
  const ref = useRef(null);
  useEffect(() => {
    if (ref.current) drawSlide(ref.current, slide, i, total, opts, img);
  }, [slide, i, total, opts, img, ready]);
  return (
    <button className={"thumb" + (active ? " on" : "")} onClick={onClick} title={"Slide " + (i + 1)}>
      <canvas ref={ref} />
    </button>
  );
}

// ---- Planner ----------------------------------------------------------------
const PLATFORMS = [
  { id: "linkedin", label: "LinkedIn", ayr: "linkedin" },
  { id: "x", label: "X", ayr: "twitter" },
  { id: "instagram", label: "Instagram", ayr: "instagram" },
  { id: "threads", label: "Threads", ayr: "threads" },
  { id: "facebook", label: "Facebook", ayr: "facebook" },
];
const AYR_POST = "https://api.ayrshare.com/api/post";
const AYR_UPLOAD = "https://api.ayrshare.com/api/media/upload";

// What each platform actually accepts. chars is a hard API/UI limit; tags is a
// hard limit where one exists (Instagram); maxImages is per post (X 4, IG
// carousel 10 via API, LinkedIn multi-image 9); minImages because Instagram
// cannot post bare text through the API.
const PLATFORM_RULES = {
  linkedin: { name: "LinkedIn", chars: 3000, tags: Infinity, maxImages: 9, minImages: 0 },
  x: { name: "X", chars: 280, tags: Infinity, maxImages: 4, minImages: 0 },
  instagram: { name: "Instagram", chars: 2200, tags: 30, maxImages: 10, minImages: 1 },
  threads: { name: "Threads", chars: 500, tags: Infinity, maxImages: 20, minImages: 0 },
  facebook: { name: "Facebook", chars: 63206, tags: Infinity, maxImages: 10, minImages: 0 },
};

function postStats(item) {
  const cap = item.caption || "";
  return {
    chars: cap.length,
    tags: (cap.match(/#[\p{L}\d_]+/gu) || []).length,
    images: (item.images || []).length,
  };
}

// Violations for one platform. Empty array = good to post there.
function checkPlatform(item, id) {
  const r = PLATFORM_RULES[id];
  if (!r) return [];
  const s = postStats(item);
  const out = [];
  if (s.chars > r.chars) out.push(s.chars + "/" + r.chars + " characters");
  if (s.tags > r.tags) out.push(s.tags + "/" + r.tags + " hashtags");
  if (s.images > r.maxImages) out.push(s.images + " images (max " + r.maxImages + ")");
  if (s.images < r.minImages) out.push("needs at least " + r.minImages + " image");
  return out;
}

function checkViolations(item) {
  const out = [];
  for (const id of item.platforms || []) {
    for (const v of checkPlatform(item, id)) out.push((PLATFORM_RULES[id] || {}).name + ": " + v);
  }
  return out;
}

// Where a platform's composer opens, prefilled where the platform allows it.
function composerUrl(platformId, caption) {
  const t = encodeURIComponent(caption || "");
  if (platformId === "x") return "https://twitter.com/intent/tweet?text=" + t;
  if (platformId === "threads") return "https://www.threads.net/intent/post?text=" + t;
  if (platformId === "linkedin") return "https://www.linkedin.com/feed/?shareActive=true";
  if (platformId === "facebook") return "https://www.facebook.com/";
  if (platformId === "instagram") return "https://www.instagram.com/";
  return "";
}

// Tiny IndexedDB key/value store (holds the whole plan, including slide images,
// which would overflow localStorage). No dependency, stays in the single file.
function idbOpen() {
  return new Promise((res, rej) => {
    const req = indexedDB.open("thedesk", 1);
    req.onupgradeneeded = () => { if (!req.result.objectStoreNames.contains("kv")) req.result.createObjectStore("kv"); };
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}
async function idbGet(key) {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const t = db.transaction("kv", "readonly").objectStore("kv").get(key);
    t.onsuccess = () => res(t.result);
    t.onerror = () => rej(t.error);
  });
}
async function idbSet(key, val) {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction("kv", "readwrite");
    tx.objectStore("kv").put(val, key);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
}

function copyText(text) {
  const ta = document.createElement("textarea");
  ta.value = text; document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); } catch (e) {}
  document.body.removeChild(ta);
}

const BLANK_POST = () => ({
  id: "p" + Date.now() + Math.random().toString(36).slice(2, 6),
  caption: "", platforms: ["linkedin"], date: new Date().toISOString().slice(0, 10),
  time: "09:00", status: "draft", images: [],
});

function Planner({ ayrKey, setAyrKey, webhookUrl, setWebhookUrl, webhookImages, setWebhookImages, liToken, setLiToken, onBack }) {
  const [items, setItems] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [editing, setEditing] = useState(null);
  const [month, setMonth] = useState(() => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1); });
  const [status, setStatus] = useState("");
  const fileRef = useRef(null);
  const imgRef = useRef(null);
  const overrideRef = useRef(null); // post id allowed to bypass criteria warnings once

  // Read chosen photo files and attach them to the post being edited.
  function addImages(files) {
    for (const f of Array.from(files || [])) {
      const fr = new FileReader();
      fr.onload = async () => {
        try {
          const img = await normalizeUpload(fr.result);
          setEditing((ed) => (ed ? { ...ed, images: [...(ed.images || []), img] } : ed));
        } catch (e) { setStatus("Could not read one of the images."); }
      };
      fr.readAsDataURL(f);
    }
  }

  useEffect(() => {
    let dead = false;
    idbGet("plan").then((p) => { if (!dead) { setItems(Array.isArray(p) ? p : []); setLoaded(true); } })
      .catch(() => { if (!dead) setLoaded(true); });
    // Refresh when the background scheduler auto-sends something.
    const reload = () => idbGet("plan").then((p) => { if (!dead) setItems(Array.isArray(p) ? p : []); }).catch(() => {});
    window.addEventListener("plan-updated", reload);
    return () => { dead = true; window.removeEventListener("plan-updated", reload); };
  }, []);

  function persist(next) { setItems(next); idbSet("plan", next).catch(() => setStatus("Could not save locally.")); }
  function upsert(item) {
    const exists = items.some((x) => x.id === item.id);
    persist(exists ? items.map((x) => (x.id === item.id ? item : x)) : [...items, item]);
    setEditing(null);
  }
  function remove(id) { persist(items.filter((x) => x.id !== id)); setEditing(null); }

  function exportPlan() {
    const blob = new Blob([JSON.stringify({ version: 1, items }, null, 2)], { type: "application/json" });
    downloadBlob(blob, "the-desk-plan.json");
  }
  function importPlan(file) {
    const fr = new FileReader();
    fr.onload = () => {
      try {
        const data = JSON.parse(fr.result);
        const incoming = Array.isArray(data) ? data : (data.items || []);
        const byId = {}; [...items, ...incoming].forEach((x) => { if (x && x.id) byId[x.id] = x; });
        persist(Object.values(byId));
        setStatus("Imported " + incoming.length + " posts.");
      } catch (e) { setStatus("That file could not be read."); }
    };
    fr.readAsText(file);
  }

  // Assisted post: copy caption, download images as JPG, open the composer.
  async function assist(item, platformId) {
    copyText(item.caption || "");
    const imgs = item.images || [];
    for (let k = 0; k < imgs.length; k++) {
      const j = await toJpegDataUrl(imgs[k], 0.95);
      const a = document.createElement("a");
      a.href = j; a.download = "post-" + item.id + "-slide-" + (k + 1) + ".jpg"; a.click();
      await new Promise((r) => setTimeout(r, 250));
    }
    const url = composerUrl(platformId, item.caption || "");
    if (url) window.open(url, "_blank", "noopener");
    setStatus("Caption copied and images downloaded. Paste into " + (PLATFORMS.find((p) => p.id === platformId) || {}).label + ", then attach the images.");
  }

  async function autoPost(item) {
    const key = (ayrKey || "").trim();
    if (!key) { setStatus("Add your Ayrshare API key below to auto-post."); return; }
    if (!item.platforms || !item.platforms.length) { setStatus("Pick at least one platform first."); return; }
    setStatus("Posting via Ayrshare...");
    try {
      const mediaUrls = [];
      for (const d of (item.images || [])) {
        const up = await fetch(AYR_UPLOAD, {
          method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + key },
          body: JSON.stringify({ file: d, fileName: "slide.png" }),
        });
        const ud = await up.json().catch(() => ({}));
        if (!up.ok || ud.status === "error") throw new Error(ud.message || ("image upload failed (" + up.status + ")"));
        if (ud.url) mediaUrls.push(ud.url);
      }
      const platforms = item.platforms.map((id) => (PLATFORMS.find((p) => p.id === id) || {}).ayr).filter(Boolean);
      const body = { post: item.caption, platforms };
      if (mediaUrls.length) body.mediaUrls = mediaUrls;
      const r = await fetch(AYR_POST, {
        method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + key },
        body: JSON.stringify(body),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok || d.status === "error") throw new Error(d.message || ("Ayrshare error " + r.status));
      persist(items.map((x) => (x.id === item.id ? { ...x, status: "posted" } : x)));
      setStatus("Posted to " + platforms.join(", ") + ".");
    } catch (e) {
      setStatus("Auto-post failed: " + (e && e.message ? e.message : e));
    }
  }

  // Free path: push the post to the user's own automation (Make, n8n, Zapier,
  // self-hosted Postiz). Fire-and-forget so cross-origin webhooks still receive
  // it; the automation does the actual posting for free.
  async function postWebhook(item) {
    const url = (webhookUrl || "").trim();
    if (!url) { setStatus("Add a free automation webhook URL below (Make, n8n, Zapier, or self-hosted Postiz)."); return; }
    // Enforce each selected platform's criteria before sending. One more click
    // on the same post overrides, in case the user disagrees.
    const viol = checkViolations(item);
    if (viol.length && overrideRef.current !== item.id) {
      overrideRef.current = item.id;
      setStatus("Fix before posting: " + viol.join(" · ") + ". Or click Send again to post anyway.");
      return;
    }
    overrideRef.current = null;
    setStatus("Sending to your automation...");
    try {
      await sendItemToWebhook(item, url, webhookImages, liToken);
      persist(items.map((x) => (x.id === item.id ? { ...x, status: "posted" } : x)));
      setStatus("Sent to your automation. Check it (Make/n8n/etc.) to confirm the post went out.");
    } catch (e) {
      setStatus("Could not reach the webhook: " + (e && e.message ? e.message : e));
    }
  }

  // One zip with everything compliance needs: the caption as a text file and
  // every slide as a high-quality JPG (their system only accepts JPG/JPEG).
  async function compliancePack(item) {
    const files = [{ name: "caption.txt", data: new TextEncoder().encode(item.caption || "") }];
    const imgs = item.images || [];
    for (let k = 0; k < imgs.length; k++) {
      const j = await toJpegDataUrl(imgs[k], 0.95);
      files.push({ name: "slide-" + String(k + 1).padStart(2, "0") + ".jpg", data: dataUrlBytes(j) });
    }
    downloadBlob(makeZip(files), "compliance-" + (item.date || "post") + ".zip");
    setStatus("Compliance pack downloaded: caption.txt + " + imgs.length + " JPG image(s).");
  }

  // Bundle this post's slides into a PDF, which is how LinkedIn does carousels
  // (upload it as a document post).
  async function itemPdf(item) {
    const imgs = item.images || [];
    if (!imgs.length) { setStatus("This post has no slides to turn into a PDF."); return; }
    const urls = [];
    for (const d of imgs) urls.push(await toJpegDataUrl(d, 0.95));
    downloadBlob(makePdf(urls), "linkedin-carousel.pdf");
    setStatus("PDF downloaded. On LinkedIn: start a post, click the document icon, and upload it.");
  }

  const upcoming = [...items].sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  const y = month.getFullYear(), m = month.getMonth();
  const first = new Date(y, m, 1).getDay();
  const days = new Date(y, m + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < first; i++) cells.push(null);
  for (let d = 1; d <= days; d++) cells.push(d);
  const monthName = month.toLocaleDateString(undefined, { month: "long", year: "numeric" });
  const iso = (d) => y + "-" + String(m + 1).padStart(2, "0") + "-" + String(d).padStart(2, "0");

  return (
    <div className="planner">
      <div className="plan-bar">
        <div className="plan-actions">
          <button className="act" onClick={() => setEditing(BLANK_POST())}>New post</button>
          <button className="act ghost" onClick={exportPlan}>Export</button>
          <button className="act ghost" onClick={() => fileRef.current && fileRef.current.click()}>Import</button>
          <input ref={fileRef} type="file" accept="application/json" style={{ display: "none" }}
            onChange={(e) => { if (e.target.files[0]) importPlan(e.target.files[0]); e.target.value = ""; }} />
        </div>
        {status && <div className="plan-status">{status}</div>}
      </div>

      <div className="cal">
        <div className="cal-head">
          <button className="nav" onClick={() => setMonth(new Date(y, m - 1, 1))}>‹</button>
          <span className="cal-title">{monthName}</span>
          <button className="nav" onClick={() => setMonth(new Date(y, m + 1, 1))}>›</button>
        </div>
        <div className="cal-dow-row">
          {["S", "M", "T", "W", "T", "F", "S"].map((d, i) => (<div key={"h" + i} className="cal-dow">{d}</div>))}
        </div>
        <div className="cal-grid">
          {cells.map((d, i) => {
            const dayItems = d ? items.filter((x) => x.date === iso(d)) : [];
            return (
              <div key={i} className={"cal-cell" + (d ? "" : " empty")} onClick={() => d && setEditing({ ...BLANK_POST(), date: iso(d) })}>
                {d && <span className="cal-num">{d}</span>}
                {dayItems.slice(0, 3).map((x) => (
                  <button key={x.id} className={"cal-chip s-" + x.status} onClick={(e) => { e.stopPropagation(); setEditing(x); }} title={x.caption}>
                    {x.time} {(x.caption || "post").slice(0, 14)}
                  </button>
                ))}
                {dayItems.length > 3 && <span className="cal-more">+{dayItems.length - 3}</span>}
              </div>
            );
          })}
        </div>
      </div>

      <div className="plan-key">
        <div className="ctrl-label">Free auto-post webhook <span className="opt">recommended</span></div>
        <input className="topic" type="text" value={webhookUrl} autoComplete="off"
          onChange={(e) => setWebhookUrl(e.target.value)} placeholder="Webhook URL from Make, n8n, Zapier, or self-hosted Postiz" />
        <p className="hint">The free route. Connect your accounts once in a free tool (Make.com, n8n, or self-hosted Postiz), paste its webhook URL here, and "Send to automation" pushes each post to it to publish for you. Only X may cost money; Facebook, Instagram, Threads, and LinkedIn are free to post.</p>
        <label className="wh-check">
          <input type="checkbox" checked={!!webhookImages} onChange={(e) => setWebhookImages(e.target.checked)} />
          Include slide images in the webhook. Leave off while you set Make up (images make the payload large).
        </label>

        <div className="ctrl-label">LinkedIn API token <span className="opt">for automatic PDF carousels</span></div>
        <input className="topic" type="password" value={liToken} autoComplete="off"
          onChange={(e) => setLiToken(e.target.value)} placeholder="Paste the access token from LinkedIn's developer token generator" />
        <p className="hint">With a token, LinkedIn posts that have images publish as real PDF document carousels automatically. Tokens last about 60 days; regenerate and re-paste when it expires. Without a token, LinkedIn keeps posting the caption as text.</p>

        <div className="ctrl-label">Ayrshare API key <span className="opt">optional, paid</span></div>
        <input className="topic" type="password" value={ayrKey} autoComplete="off"
          onChange={(e) => setAyrKey(e.target.value)} placeholder="Ayrshare key (paid) to auto-post to all linked accounts" />
        <p className="hint">A paid shortcut if you prefer not to set up an automation. Your plan always lives here in your browser either way.</p>
      </div>

      <div className="plan-list">
        <div className="ctrl-label">Upcoming</div>
        {loaded && upcoming.length === 0 && <p className="hint">No posts yet. Click a day, or use New post, or send a draft over from the Studio.</p>}
        {upcoming.map((x) => (
          <div key={x.id} className="plan-item">
            <div className="pi-top">
              <span className="pi-date">{x.date} {x.time}</span>
              <span className={"pi-status s-" + x.status}>{x.status}</span>
            </div>
            <div className="pi-cap">{(x.caption || "").slice(0, 160) || "(empty caption)"}</div>
            <div className="pi-plats">{x.platforms.map((id) => (PLATFORMS.find((p) => p.id === id) || {}).label).join(" · ")}{x.images && x.images.length ? "  ·  " + x.images.length + " images" : ""}</div>
            {checkViolations(x).length > 0 && (
              <div className="pi-viol">{checkViolations(x).map((v, k) => (<div key={k}>✗ {v}</div>))}</div>
            )}
            <div className="pi-actions">
              <button className="act ghost sm" onClick={() => setEditing(x)}>Edit</button>
              <button className="act sm" onClick={() => compliancePack(x)}>Compliance pack</button>
              {x.platforms.map((id) => (
                <button key={id} className="act sm" onClick={() => assist(x, id)}>Post to {(PLATFORMS.find((p) => p.id === id) || {}).label}</button>
              ))}
              {x.images && x.images.length > 0 && (
                <button className="act sm" onClick={() => itemPdf(x)}>PDF for LinkedIn</button>
              )}
              <button className="act sm auto" onClick={() => postWebhook(x)}>Send to automation</button>
              {ayrKey.trim() && <button className="act sm" onClick={() => autoPost(x)}>Ayrshare</button>}
            </div>
          </div>
        ))}
      </div>

      {editing && (
        <div className="modal-back" onClick={() => setEditing(null)}>
          <div className="modal" onClick={(e) => e.stopPropagation()}>
            <div className="ctrl-label">Caption</div>
            <textarea className="disc-box" rows={6} value={editing.caption} onChange={(e) => setEditing({ ...editing, caption: e.target.value })} />
            <div className="limit-note">
              {postStats(editing).chars} characters · {postStats(editing).tags} hashtags · {postStats(editing).images} images
            </div>
            <div className="ctrl-label">Platforms</div>
            <div className="plat-row">
              {PLATFORMS.map((p) => {
                const on = editing.platforms.includes(p.id);
                return (
                  <button key={p.id} className={"tone" + (on ? " on" : "")}
                    onClick={() => setEditing({ ...editing, platforms: on ? editing.platforms.filter((x) => x !== p.id) : [...editing.platforms, p.id] })}>{p.label}</button>
                );
              })}
            </div>
            {editing.platforms.length > 0 && (
              <div className="limit-checks">
                {editing.platforms.map((id) => {
                  const r = PLATFORM_RULES[id]; if (!r) return null;
                  const probs = checkPlatform(editing, id);
                  return (
                    <div key={id} className={"limit-row" + (probs.length ? " bad" : "")}>
                      {probs.length ? "✗" : "✓"} {r.name}: {probs.length ? probs.join(", ") : "fits (" + r.chars + " chars" + (isFinite(r.tags) ? ", " + r.tags + " tags" : "") + ", " + r.maxImages + " imgs max)"}

            <div className="two-col">
